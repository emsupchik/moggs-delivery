  },
  supportActor() { const me = this.me(); return me && me.role === 'customer' ? { id: me.id, tag: me.tag, name: me.name, role: 'customer' } : Guest.get(); },
  userUnread(actorId) { return Db.data.tickets.filter(t => t.userId === actorId).reduce((s, t) => s + (t.userUnread || 0), 0); },
  chat: cid => Db.data.courierChats[cid] || { messages: [], adminUnread: 0, courierUnread: 0 },
  newTickets: () => Db.data.tickets.filter(t => t.status === 'new'),
  eta(o) { return o.status >= 5 ? 0 : Math.max(2, Math.round(o.etaTotal * [1, .85, .7, .5, .25][o.status])); },
};

/* ── Api (команды, mock-backend). BACKEND: заменить тела методов на fetch()/SDK ── */
class ApiError extends Error {}
const SIM_AUTO = { 0: CONFIG.sim.acceptedMs, 1: CONFIG.sim.cookingMs, 3: CONFIG.sim.pickupMs };
function applyStatus(o, s) {
  const ts = Date.now();
  o.history = o.history.filter(x => x.status < s); o.history.push({ status: s, ts });
  o.status = s; o.autoAt = SIM_AUTO[s] ? ts + SIM_AUTO[s] : null;
  if (s === 5) o.deliveredAt = ts;
}
const newTag = (role, d) => {
  if (role === 'courier') return '@courier_' + (d.counters.courier++);
  let t; do { t = '@customer_' + rnd(1000, 9999); } while (d.users.some(u => u.tag === t));
  return t;
};
const Sms = { // BACKEND: реальная отправка SMS
  send(phone) { Toast.show(`Код отправлен на номер ${fmtPhone(phone)}`, { icon: '💬', title: 'SMS отправлено', duration: 4000 }); },
};

const Api = {
  _pending: null,
  auth: {
    async login({ role, login, password }) {
      await sleep(250); Db.sync();
      const users = Db.data.users.filter(u => u.role === role);
      const q = String(login).trim().toLowerCase(), ph = normPhone(login);
      /* заказчик и курьер входят по телефону ИЛИ по логину, администратор — по логину */
      const u = role === 'admin' ? users.find(x => x.login === q) : users.find(x => (ph && x.phone === ph) || (x.login && x.login === q));
      if (!u || u.password !== password) throw new ApiError('Неверный логин или пароль');
      Session.set(SESSION_KEY, u.id);
      return u;
    },
    async startRegistration(role, form) {
      await sleep(300); Db.sync();
      const phone = normPhone(form.phone);
      if (Db.data.users.some(u => u.phone === phone)) throw new ApiError('Этот номер уже зарегистрирован — попробуйте войти');
      Api._pending = { role, form: { ...form, phone } };
      Sms.send(phone);
      return { phone };
    },
    resendSms() { if (Api._pending) Sms.send(Api._pending.form.phone); },
    async confirmSms(code) {
      await sleep(350);
      if (!Api._pending) throw new ApiError('Сессия регистрации истекла. Начните заново.');
      if (code !== CONFIG.smsCode) throw new ApiError('Неверный код. Проверьте SMS и попробуйте ещё раз');
      const { role, form } = Api._pending;
      const user = tx(d => {
        const u = { id: 'u_' + uid(), role, tag: newTag(role, d), phone: form.phone, password: form.password, createdAt: Date.now() };
        if (role === 'customer') {
          u.name = form.name.trim() || 'Заказчик';
          u.address = null;   // адрес вводится при оформлении заказа и сохраняется в профиле
        } else {
          Object.assign(u, { name: form.name.trim(), age: +form.age, transport: form.transport, workTime: form.workTime, docName: form.docName || '', online: true });
        }
        d.users.push(u); return u;
      });
      Api._pending = null; Session.set(SESSION_KEY, user.id);
      return user;
    },
    logout() { Session.del(SESSION_KEY); },
  },
  users: {
    async updateAddress(id, address) { await sleep(150); tx(d => { const u = d.users.find(x => x.id === id); if (u) u.address = { ...address }; }); },
  },
  courier: {
    async setOnline(id, online) { await sleep(120); tx(d => { const u = d.users.find(x => x.id === id); if (u) u.online = !!online; }); },
  },
  orders: {
    async create(userId, { items, address, payment, comment, promo = null, bonus = 0 }) {
      await sleep(450);
      return tx(d => {
        const n = d.counters.order++, now = Date.now();
        const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
        /* BACKEND: сервер сам пересчитывает цену (промокод, баллы, доставка) и не доверяет клиенту */
        const q = Extras.quote(subtotal, { code: promo, bonusReq: bonus, userId });
        const fee = q.fee;
        const dist = +(1.2 + Math.random() * 4.8).toFixed(1);
        const o = { id: 'MG-' + n, customerId: userId, items, subtotal, fee, discount: q.discount, promo: q.promo ? q.promo.code : null, bonusUsed: q.bonusUsed, total: q.total, address: { ...address }, payment, comment: comment || '',
          status: 0, courierId: null, distance: dist, etaTotal: Math.round(18 + dist * 4), createdAt: now, history: [{ status: 0, ts: now }], autoAt: now + SIM_AUTO[0], assignedAt: null, deliveredAt: null };
        d.orders.push(o); return o;
      });
    },
    async accept(orderId, courierId) {
      await sleep(200);
      return tx(d => {
        const o = d.orders.find(x => x.id === orderId);
        if (!o || o.status !== 2 || o.courierId) throw new ApiError('Заказ уже взял другой курьер');
        if (d.orders.some(x => x.courierId === courierId && x.status >= 2 && x.status < 5)) throw new ApiError('Сначала завершите текущий заказ');
        o.courierId = courierId; o.assignedAt = Date.now(); return o;
      });
    },
    /* курьер: «Начать доставку» (2→3, дальше 3→4 автоматически) и «Заказ доставлен» (4→5) */
    async courierStep(orderId, courierId) {
      await sleep(200);
      return tx(d => {
        const o = d.orders.find(x => x.id === orderId && x.courierId === courierId);
        if (!o) throw new ApiError('Заказ не найден');
        if (o.status === 2) applyStatus(o, 3); else if (o.status === 4) applyStatus(o, 5);
        return o;
      });
    },
    async adminUpdate(orderId, { status, courierId }) {
      await sleep(200);
      return tx(d => {
        const o = d.orders.find(x => x.id === orderId); if (!o) return null;
        o.courierId = courierId || null; o.assignedAt = courierId ? (o.assignedAt || Date.now()) : null;
        if (+status !== o.status) applyStatus(o, +status);
        return o;
      });
    },
    async assign(orderId, courierId) { return Api.orders.adminUpdate(orderId, { status: Sel.order(orderId).status, courierId }); },
    /* админ: перевести заказ на следующий этап */
    async advance(orderId) {
      await sleep(150);
      return tx(d => {
        const o = d.orders.find(x => x.id === orderId); if (!o || o.status >= 5) return o;
        applyStatus(o, o.status + 1); return o;
      });
    },
  },
  support: {
    async send(actor, text) {
      text = String(text || '').trim(); if (!text) throw new ApiError('Введите сообщение');
      await sleep(120);
      return tx(d => {
        const now = Date.now();
        let t = Sel.activeTicketFor(actor.id);
        if (!t || t.status === 'closed') {
          t = { id: 'SUP-' + (d.counters.ticket++), userId: actor.id, userTag: actor.tag, userName: actor.name, userRole: actor.role || 'guest',
            status: 'new', createdAt: now, updatedAt: now, messages: [], adminUnread: 0, userUnread: 0 };
          d.tickets.push(t);
        }
        t.messages.push({ id: uid(), from: 'user', name: actor.name, tag: actor.tag, text, ts: now });
        t.updatedAt = now; t.adminUnread++;
        return t;
      });
    },
    async reply(ticketId, text, admin) {
      text = String(text || '').trim(); if (!text) throw new ApiError('Введите ответ');
      await sleep(120);
      return tx(d => {
        const t = d.tickets.find(x => x.id === ticketId); if (!t) throw new ApiError('Обращение не найдено');
        const now = Date.now();
        t.messages.push({ id: uid(), from: 'admin', name: 'Поддержка Moggs', tag: admin.tag, text, ts: now });
        t.status = 'in_progress'; t.updatedAt = now; t.userUnread++; t.adminUnread = 0;
        return t;
      });
    },
    async close(ticketId) {
      await sleep(120);
      return tx(d => {
        const t = d.tickets.find(x => x.id === ticketId); if (!t || t.status === 'closed') return t;
        const now = Date.now(); t.status = 'closed'; t.updatedAt = now; t.adminUnread = 0; t.userUnread++;
        t.messages.push({ id: uid(), from: 'system', text: 'Обращение закрыто администратором', ts: now });
        return t;
      });
    },
    async reopen(ticketId) {
      await sleep(100);
      return tx(d => { const t = d.tickets.find(x => x.id === ticketId); if (t) { t.status = 'in_progress'; t.updatedAt = Date.now(); } return t; });
    },
    markRead(ticketId, who) {
      const t = Sel.ticket(ticketId); if (!t) return;
      const key = who === 'admin' ? 'adminUnread' : 'userUnread';
      if (!t[key]) return;
      tx(d => { d.tickets.find(x => x.id === ticketId)[key] = 0; });
    },
  },
  chat: { /* чат администратор ↔ курьер */
    async send(courierId, from, text) {
      text = String(text || '').trim(); if (!text) throw new ApiError('Введите сообщение');
      await sleep(100);
      tx(d => {
        const c = d.courierChats[courierId] || (d.courierChats[courierId] = { messages: [], adminUnread: 0, courierUnread: 0 });
        c.messages.push({ id: uid(), from, text, ts: Date.now() });
        if (from === 'courier') c.adminUnread++; else c.courierUnread++;
      });
    },
    markRead(courierId, who) {
      const c = Db.data.courierChats[courierId]; if (!c) return;
      const key = who === 'admin' ? 'adminUnread' : 'courierUnread';
      if (!c[key]) return;
      tx(d => { d.courierChats[courierId][key] = 0; });
    },
  },
};

/* ── корзина (у каждого пользователя своя) ── */
const Cart = {
  items: [],
  _key() { const u = Sel.me(); return 'moggs_cart_' + (u ? u.id : 'guest'); },
  load() { try { this.items = JSON.parse(Local.get(this._key()) || '[]'); } catch (e) { this.items = []; } },
  save() { Local.set(this._key(), JSON.stringify(this.items)); Bus.emit('cart'); },
  qty(id) { const i = this.items.find(x => x.id === id); return i ? i.qty : 0; },
  add(id) { const i = this.items.find(x => x.id === id); if (i) i.qty = Math.min(20, i.qty + 1); else this.items.push({ id, qty: 1 }); this.save(); },
  dec(id) { const i = this.items.find(x => x.id === id); if (!i) return; i.qty--; if (i.qty <= 0) this.items = this.items.filter(x => x.id !== id); this.save(); },
  remove(id) { this.items = this.items.filter(x => x.id !== id); this.save(); },
  clear() { this.items = []; this.save(); },
  lines() { return this.items.map(i => ({ dish: Catalog.get(i.id), qty: i.qty })).filter(l => l.dish); },
  count() { return this.items.reduce((s, i) => s + i.qty, 0); },
  subtotal() { return this.lines().reduce((s, l) => s + l.dish.price * l.qty, 0); },
  fee() { const s = this.subtotal(); return !s || s >= CONFIG.freeDeliveryFrom ? 0 : CONFIG.deliveryFee; },
  total() { return this.subtotal() + this.fee(); },
};

/* ── симуляция кухни/курьера: автопереходы статусов ── */
const Sim = {
  start() { setInterval(() => this.tick(), 1000); },
  tick() {
    Db.sync();
    const now = Date.now(); let changed = false;
    Db.data.orders.forEach(o => { if (o.autoAt && now >= o.autoAt && o.status < 5) { applyStatus(o, o.status + 1); changed = true; } });
    if (changed) Db.commit();
  },
};

/* ── уведомления: сравниваем состояние «БД» до/после и показываем тосты по роли ── */
const Notifier = {
  prev: null,
  snap() { this.prev = JSON.parse(JSON.stringify(Db.data)); },
  run() {
    const p = this.prev, n = Db.data;
    if (!p) { this.snap(); return; }
    try {
      const me = Sel.me();
      if (me && me.role === 'admin') {
        n.tickets.forEach(t => {
          const old = p.tickets.find(x => x.id === t.id);
          const viewing = App.view === 'admin' && App.state.adminSection === 'support' && App.state.adminTicketId === t.id;
          if (!old) {
            Toast.show(`«${t.messages[0]?.text || ''}»`, { icon: '🆕', title: `Новое обращение #${t.id} · ${t.userTag}`, action: { label: 'Открыть', fn: () => AdminView.openTicketFromAnywhere(t.id) } });
          } else if (t.adminUnread > old.adminUnread && !viewing) {
            Toast.show(t.messages[t.messages.length - 1].text, { icon: '💬', title: `${t.userTag} · #${t.id}`, action: { label: 'Открыть', fn: () => AdminView.openTicketFromAnywhere(t.id) } });
          }
        });
        Object.keys(n.courierChats).forEach(cid => {
          const c = n.courierChats[cid], o = p.courierChats[cid];
          if (c.adminUnread > (o ? o.adminUnread : 0) && !Modal.isOpen('courier-chat')) {
            const k = Sel.user(cid);
            Toast.show(c.messages[c.messages.length - 1].text, { icon: '🛵', title: `Сообщение от курьера ${k ? k.tag : ''}`, action: { label: 'Ответить', fn: () => AdminUI.contactCourier(cid) } });
          }
        });
      }
      if (me && me.role === 'customer') {
        n.orders.filter(o => o.customerId === me.id).forEach(o => {
          const old = p.orders.find(x => x.id === o.id); if (!old) return;
          if (o.status !== old.status) Toast.show(ORDER_STATUSES[o.status].desc, { icon: ORDER_STATUSES[o.status].icon, title: `#${o.id} · ${ORDER_STATUSES[o.status].label}`, action: o.status === 5 ? { label: 'Оценить блюда', fn: () => ReviewUI.open(o.id) } : undefined, duration: o.status === 5 ? 9000 : undefined });
          else if (o.courierId && !old.courierId) { const k = Sel.user(o.courierId); Toast.show(`Курьер ${k ? k.name : ''} едет за вашим заказом`, { icon: '🛵', title: `#${o.id} · курьер назначен` }); }
        });
      }
      if (me && (me.role === 'customer' || !me)) { /* ответы поддержки — ниже */ }
      /* ответы поддержки (для заказчика и гостя) */
      const actor = me && me.role === 'customer' ? me : (me ? null : Guest.get());
      if (actor) {
        n.tickets.filter(t => t.userId === actor.id).forEach(t => {
          const old = p.tickets.find(x => x.id === t.id);
          if (old && t.userUnread > old.userUnread && !Modal.isOpen('support')) {
            const last = t.messages[t.messages.length - 1];
            Toast.show(last.text, { icon: '💬', title: 'Ответ поддержки Moggs', action: { label: 'Открыть', fn: () => SupportUI.open() } });
          }
        });
      }
      if (me && me.role === 'courier') {
        const before = new Set(p.orders.filter(o => o.status === 2 && !o.courierId).map(o => o.id));
        n.orders.filter(o => o.status === 2 && !o.courierId && !before.has(o.id)).forEach(o => {
          Toast.show(`${addrLine(o.address)} · ${money(o.total)}`, { icon: '📦', title: `Новый заказ #${o.id}` });
        });
        const c = n.courierChats[me.id], oc = p.courierChats[me.id];
        if (c && c.courierUnread > (oc ? oc.courierUnread : 0) && CourierView.tab !== 'chat') {
          Toast.show(c.messages[c.messages.length - 1].text, { icon: '💬', title: 'Сообщение от администратора', action: { label: 'Открыть', fn: () => Router.go('#/courier/chat') } });
        }
      }
    } catch (e) { console.error(e); }
    this.snap();
  },
};
</script>
<script>

/* ════════════════════════════════════════════════════════════════
   2b. EXTRAS — избранное, промокоды, бонусы, отзывы, рекомендации
   ────────────────────────────────────────────────────────────────
   Это MVP-слой поверх готового сайта. Всё, что в реальном продукте
   решает сервер, здесь ЯВНО отделено и помечено «BACKEND»:
     · проверка промокодов и лимитов      → Extras.promo / Extras.quote
     · начисление и списание баллов        → Extras.bonus
     · хранение отзывов и рейтингов        → Extras.reviews
   Хранилище — localStorage (как и остальная «БД»). Расчёт цены заказа
   делает Extras.quote() — ЧИСТАЯ функция; на бэкенде её нужно
   выполнять на сервере, а не доверять клиенту.
   ════════════════════════════════════════════════════════════════ */
const Extras = {
  uid() { const u = Sel.me(); return u ? u.id : 'guest'; },
  read(k, def) { try { const r = Local.get(k); return r ? JSON.parse(r) : def; } catch (e) { return def; } },
  write(k, v) { Local.set(k, JSON.stringify(v)); },
};

/* ── 1. Избранное ── */
Extras.fav = {
  key() { return 'moggs_fav_' + Extras.uid(); },
  list() { return Extras.read(this.key(), []).filter(id => Catalog.get(id)); },
  has(id) { return this.list().includes(id); },
  toggle(id) {
    let l = this.list(); const on = !l.includes(id);
    l = on ? [id, ...l] : l.filter(x => x !== id);
    Extras.write(this.key(), l); Bus.emit('fav', { id, on });
    return on;
  },
};

/* ── 2. Промокоды (BACKEND: справочник и лимиты хранятся на сервере) ── */
const PROMOS = {
  WELCOME10:    { type: 'percent',  value: 10,  limit: 1, min: 0,    title: 'Скидка 10% на заказ',        short: '−10%' },
  FIRST500:     { type: 'fixed',    value: 500, limit: 1, min: 2000, title: 'Скидка 500 ₸ от 2 000 ₸',    short: '−500 ₸' },
  FREEDELIVERY: { type: 'delivery', value: 0,   limit: 3, min: 0,    title: 'Бесплатная доставка',        short: 'Доставка 0 ₸' },
};
Extras.promo = {
  key() { return 'moggs_promo_' + Extras.uid(); },
  state() { const s = Extras.read(this.key(), null); return s && typeof s === 'object' ? { active: s.active || null, used: s.used || {} } : { active: null, used: {} }; },
  save(s) { Extras.write(this.key(), s); },
  usedCount(code) { return this.state().used[code] || 0; },
  /* проверка кода: { ok, code, promo } или { ok:false, error } */
  check(raw, sub, { allowEmpty = false, ignoreMin = false } = {}) {
    const code = String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
    if (!code) return { ok: false, error: 'Введите промокод' };
    const p = PROMOS[code];
    if (!p) return { ok: false, error: 'Такого промокода не существует' };
    const used = this.usedCount(code);
    if (used >= p.limit) return { ok: false, error: p.limit === 1 ? 'Вы уже использовали этот промокод' : `Лимит использования исчерпан (${used} из ${p.limit})` };
    if (!sub && !allowEmpty) return { ok: false, error: 'Сначала добавьте блюда в корзину' };
    if (sub && sub < p.min && !ignoreMin) return { ok: false, error: `Промокод действует от ${money(p.min)} — добавьте ещё ${money(p.min - sub)}` };
    return { ok: true, code, promo: p };
  },
  apply(raw, opts) {
    const r = this.check(raw, Cart.subtotal(), opts);
    if (!r.ok) return r;
    const s = this.state(); s.active = r.code; this.save(s);
    Bus.emit('promo', { code: r.code });
    return r;
  },
  remove() { const s = this.state(); s.active = null; this.save(s); Bus.emit('promo', { code: null }); },
  /* вызывается после успешного оформления заказа */
  consume(code) {
    if (!code) return;
    const s = this.state(); s.used[code] = (s.used[code] || 0) + 1; if (s.active === code) s.active = null; this.save(s);
    Bus.emit('promo', { code: null });
  },
};

/* ── 3. Бонусная программа ── */
const BONUS = {
  welcome: 200,          // разовый приветственный бонус
  spendMaxShare: .5,     // баллами можно оплатить до 50% суммы (1 балл = 1 ₸)
  levels: [
    { id: 'bronze', name: 'Bronze', from: 0,    rate: .05, emoji: '🥉' },
    { id: 'silver', name: 'Silver', from: 500,  rate: .07, emoji: '🥈' },
    { id: 'gold',   name: 'Gold',   from: 2000, rate: .10, emoji: '🥇' },
  ],
};
Extras.bonus = {
  key() { return 'moggs_bonus_' + Extras.uid(); },
  state() { const s = Extras.read(this.key(), null); return s && Array.isArray(s.history) ? s : { balance: 0, lifetime: 0, history: [] }; },
  save(s) { Extras.write(this.key(), s); Bus.emit('bonus'); },
  levelOf(lifetime) { let cur = BONUS.levels[0]; BONUS.levels.forEach(l => { if (lifetime >= l.from) cur = l; }); return cur; },
  info() {
    const s = this.state(), level = this.levelOf(s.lifetime), i = BONUS.levels.indexOf(level), next = BONUS.levels[i + 1] || null;
    const top = BONUS.levels[BONUS.levels.length - 1].from;
    return { ...s, level, next, toNext: next ? next.from - s.lifetime : 0, pct: Math.min(100, Math.round(s.lifetime / top * 100)) };
  },
  /* BACKEND: начисление делает сервер при статусе «Доставлен». Здесь — идемпотентно
     проходим по доставленным заказам и начисляем то, что ещё не начислено. */
  settle() {
    const me = Sel.me(); if (!me || me.role !== 'customer') return null;
    const s = this.state(); let got = 0, welcome = false, changed = false;
    if (!s.history.some(h => h.kind === 'welcome')) {
      s.history.push({ id: 'w', kind: 'welcome', type: 'earn', amount: BONUS.welcome, ts: me.createdAt || Date.now(), title: 'Приветственный бонус' });
      s.balance += BONUS.welcome; s.lifetime += BONUS.welcome; got += BONUS.welcome; welcome = true; changed = true;
    }
    Sel.customerOrders(me.id).filter(o => o.status === 5).sort((a, b) => (a.deliveredAt || 0) - (b.deliveredAt || 0)).forEach(o => {
      if (s.history.some(h => h.kind === 'order' && h.orderId === o.id)) return;
      const rate = this.levelOf(s.lifetime).rate, amount = Math.floor(Math.max(0, o.total - (o.fee || 0)) * rate);
      s.history.push({ id: 'o' + o.id, kind: 'order', type: 'earn', amount, orderId: o.id, ts: o.deliveredAt || Date.now(), title: `Начисление за заказ #${o.id}`, note: `Кэшбэк ${Math.round(rate * 100)}%` });
      s.balance += amount; s.lifetime += amount; got += amount; changed = true;
    });
    if (changed) { s.history.sort((a, b) => b.ts - a.ts); this.save(s); }
    return changed ? { got, welcome } : null;
  },
  spend(amount, orderId) {
    if (!(amount > 0)) return;
    const s = this.state(); amount = Math.min(amount, s.balance);
    s.balance -= amount;
    s.history.unshift({ id: 's' + orderId, kind: 'spend', type: 'spend', amount, orderId, ts: Date.now(), title: `Списание на заказ #${orderId}` });
    this.save(s);
  },
  /* сколько баллов ещё «в пути» по активным заказам */
  pending() {
    const me = Sel.me(); if (!me) return [];
    const s = this.state(), rate = this.levelOf(s.lifetime).rate;
    return Sel.customerOrders(me.id).filter(o => o.status < 5).map(o => ({ orderId: o.id, est: Math.floor(Math.max(0, o.total - (o.fee || 0)) * rate) }));
  },
};

/* ── 4. Расчёт цены заказа (BACKEND: выполнять на сервере) ── */
Extras.quote = function (sub, { code = null, bonusReq = 0, userId = null } = {}) {
  const uid = userId || Extras.uid();
  const pst = Extras.read('moggs_promo_' + uid, { active: null, used: {} }), bst = Extras.read('moggs_bonus_' + uid, { balance: 0, lifetime: 0 });
  const p = code ? PROMOS[code] : null, used = ((pst.used || {})[code] || 0);
  let promo = null, note = '', discount = 0, freeShip = false;
  if (code && p) {
    if (used >= p.limit) note = 'Лимит использования исчерпан';
    else if (!sub) note = 'Добавьте блюда, чтобы применить';
    else if (sub < p.min) note = `Действует от ${money(p.min)} — добавьте ещё ${money(p.min - sub)}`;
    else {
      promo = { code, ...p };
      if (p.type === 'percent') discount = Math.round(sub * p.value / 100);
      else if (p.type === 'fixed') discount = Math.min(p.value, sub);
      else freeShip = true;
    }
  }
  const free = !!sub && (sub >= CONFIG.freeDeliveryFrom || freeShip);
  const fee = !sub || free ? 0 : CONFIG.deliveryFee;
  const bonusMax = Math.max(0, Math.min(bst.balance || 0, Math.floor((sub - discount) * BONUS.spendMaxShare)));
  const bonusUsed = Math.max(0, Math.min(Math.floor(bonusReq) || 0, bonusMax));
  const payable = Math.max(0, sub - discount - bonusUsed);
  const rate = Extras.bonus.levelOf(bst.lifetime || 0).rate;
  return {
    sub, promo, promoNote: note, discount, freeShip, fee, free,
    leftForFree: sub && !free ? CONFIG.freeDeliveryFrom - sub : 0,
    progress: Math.min(100, Math.round(sub / CONFIG.freeDeliveryFrom * 100)),
    bonusMax, bonusUsed, payable, total: payable + fee, earn: Math.floor(payable * rate),
  };
};
Extras.calc = function (bonusReq = 0) { return Extras.quote(Cart.subtotal(), { code: Extras.promo.state().active, bonusReq }); };

/* корзина теперь считает по промокоду */
Cart.fee = function () { return Extras.calc(0).fee; };
Cart.total = function () { return Extras.calc(0).total; };
/* добавить сразу несколько позиций с количеством (для «Повторить заказ») */
Cart.addMany = function (list) {
  let added = 0; const skipped = [];
  list.forEach(({ id, qty, name }) => {
    if (!Catalog.get(id)) { skipped.push(name || id); return; }
    const i = this.items.find(x => x.id === id);
    if (i) i.qty = Math.min(20, i.qty + qty); else this.items.push({ id, qty: Math.min(20, qty) });
    added += qty;
  });
  this.save();
  return { added, skipped };
};

/* ── 5. Отзывы и рейтинг (BACKEND: таблица reviews, модерация) ── */
Extras.reviews = {
  KEY: 'moggs_reviews_v1',
  all() { return Extras.read(this.KEY, []); },
  forDish(id) { return this.all().filter(r => r.dishId === id).sort((a, b) => b.ts - a.ts); },
  stats(id) {
    const l = this.forDish(id), dist = [0, 0, 0, 0, 0, 0];
    l.forEach(r => { dist[r.rating]++; });
    return { count: l.length, avg: l.length ? l.reduce((s, r) => s + r.rating, 0) / l.length : 0, dist };
  },
  mine(orderId, dishId) { const u = Extras.uid(); return this.all().find(r => r.userId === u && r.orderId === orderId && r.dishId === dishId) || null; },
  add({ orderId, dishId, rating, text }) {
    const me = Sel.me(), all = this.all(), u = Extras.uid();
    const ex = all.find(r => r.userId === u && r.orderId === orderId && r.dishId === dishId);
    const rec = { id: ex ? ex.id : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), userId: u, author: me ? me.name : 'Гость', orderId, dishId, rating, text: (text || '').trim(), ts: Date.now() };
    if (ex) Object.assign(ex, rec); else all.push(rec);
    Extras.write(this.KEY, all); Bus.emit('reviews', { dishId });
    return rec;
  },
  /* доставленные заказы, где есть блюда без моей оценки */
  toReview(userId) {
    return Sel.customerOrders(userId).filter(o => o.status === 5 && o.items.some(i => Catalog.get(i.id) && !this.mine(o.id, i.id)));
  },
};
const stars = (v, cls = '') => `<span class="stars ${cls}" aria-label="Рейтинг ${v.toFixed(1)} из 5">${[1, 2, 3, 4, 5].map(i => `<i class="${v >= i - .25 ? 'on' : v >= i - .75 ? 'half' : ''}">★</i>`).join('')}</span>`;

/* ── 6. Рекомендации («Вам может понравиться») ── */
const PAIRS = {
  fastfood: ['drinks', 'cold', 'snacks'], hot: ['salads', 'cold', 'tea', 'desserts'], pasta: ['salads', 'drinks', 'desserts'],
  salads: ['drinks', 'desserts'], breakfast: ['coffee', 'tea', 'desserts'], desserts: ['coffee', 'tea'], coffee: ['desserts', 'breakfast'],
  tea: ['desserts', 'breakfast'], drinks: ['fastfood', 'snacks'], cold: ['fastfood', 'snacks'], diet: ['tea', 'cold'], vegan: ['tea', 'cold'],
  snacks: ['cold', 'drinks', 'fastfood'],
};
Extras.recs = function ({ seeds = [], exclude = [], limit = 6 } = {}) {
  const me = Sel.me(), hist = {};
  if (me) Sel.customerOrders(me.id).forEach(o => o.items.forEach(i => { const d = Catalog.get(i.id); if (d) hist[d.cat] = (hist[d.cat] || 0) + i.qty; }));
  const favs = Extras.fav.list(), seedD = seeds.map(id => Catalog.get(id)).filter(Boolean), ban = new Set([...exclude, ...seeds]);
  const scored = DISHES.filter(d => !ban.has(d.id)).map(d => {
    let sc = 0, why = '';
    seedD.forEach(s => {
      const i = (PAIRS[s.cat] || []).indexOf(d.cat);
      if (i >= 0 && sc < 10 - i * 2) { sc = Math.max(sc, 10 - i * 2); why = seedD.length === 1 ? `К «${s.name}»` : 'Дополнит заказ'; }
      if (s.cat === 'fastfood' && /фри/i.test(d.name)) { sc += 8; why = seedD.length === 1 ? `К «${s.name}»` : 'Идеально к бургеру'; }
    });
    const h = Math.min(3, hist[d.cat] || 0); if (h) { sc += h; if (!why) why = 'По вашим заказам'; }
    if (favs.includes(d.id)) { sc += 2; if (!why) why = 'В избранном'; }
    if (d.badge === 'Хит') { sc += 1.2; if (!why) why = 'Хит'; }
    if (!why && d.badge) why = d.badge;
    return { d, sc, why: why || 'Популярное' };
  }).filter(x => x.sc > 0 || !seedD.length).sort((a, b) => b.sc - a.sc);
  const per = {}, out = [];
  scored.forEach(x => { if (out.length >= limit) return; if ((per[x.d.cat] || 0) >= 2) return; per[x.d.cat] = (per[x.d.cat] || 0) + 1; out.push(x); });
  return out;
};

/* ── 7. Повторить заказ ── */
Extras.repeat = function (orderId) {
  const o = Sel.order(orderId); if (!o) return null;
  const r = Cart.addMany(o.items.map(i => ({ id: i.id, qty: i.qty, name: i.name })));
  return { ...r, order: o };
};
</script>

/* ── Toast ── */
const Toast = {
  show(msg, o = {}) {
    const root = $('#toast-root'); if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast t-' + (o.type || 'info');
    el.innerHTML = `<div class="t-ic">${o.icon || 'ℹ️'}</div><div class="t-txt">${o.title ? `<b>${esc(o.title)}</b>` : ''}<span>${esc(msg)}</span>${o.action ? `<button class="t-act">${esc(o.action.label)}</button>` : ''}</div><button class="t-x" aria-label="Закрыть">${icon('x', 16)}</button>`;
    const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 220); };
    $('.t-x', el).onclick = kill;
    if (o.action) $('.t-act', el).onclick = () => { kill(); o.action.fn(); };
    root.appendChild(el);
    while (root.children.length > 4) root.firstChild.remove();
    setTimeout(kill, o.duration || 4800);
  },
  error(msg) { this.show(msg, { type: 'error', icon: '⚠️', title: 'Ошибка' }); },
  ok(msg, title) { this.show(msg, { type: 'ok', icon: '✅', title }); },
};

/* ── Modal (окна, шторка корзины, чаты) ── */
const Modal = {
  stack: [],
  open({ id, title = '', sub = '', html = '', size = 'md', cls = '', head = true, onClose, onMount }) {
    this.close(id, true);
    const layer = document.createElement('div');
    layer.className = `modal-layer size-${size} ${cls}`; layer.dataset.modal = id;
    layer.innerHTML = `<div class="modal-backdrop" data-modal-close></div><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title || id)}">${head ? `<header class="modal-head"><div class="modal-title"><h3>${esc(title)}</h3>${sub !== '' ? `<div class="modal-sub">${sub}</div>` : ''}</div><button class="icon-btn" data-modal-close aria-label="Закрыть" title="Закрыть">${icon('x')}</button></header>` : `<button class="icon-btn modal-x" data-modal-close aria-label="Закрыть" title="Закрыть">${icon('x')}</button>`}<div class="modal-body">${html}</div></section>`;
    $('#overlay-root').appendChild(layer);
    document.body.classList.add('lock');
    const m = { id, el: layer, onClose };
    this.stack.push(m);
    layer.addEventListener('click', e => {
      const c = e.target.closest('[data-modal-close]');
      if (c && c.closest('.modal-layer') === layer) this.close(id);
    });
    if (onMount) onMount(layer, m);
    return layer;
  },
  close(id, silent) {
    const i = this.stack.findIndex(m => m.id === id); if (i < 0) return;
    const [m] = this.stack.splice(i, 1);
    if (silent) m.el.remove(); else { m.el.classList.add('closing'); setTimeout(() => m.el.remove(), 180); }
    if (m.onClose) { try { m.onClose(); } catch (e) { console.error(e); } }
    if (!this.stack.length) document.body.classList.remove('lock');
  },
  closeAll() { this.stack.slice().forEach(m => this.close(m.id, true)); },
  top() { return this.stack[this.stack.length - 1]; },
  isOpen(id) { return this.stack.some(m => m.id === id); },
  el(id) { const m = this.stack.find(x => x.id === id); return m ? m.el : null; },
  body(id) { const e = this.el(id); return e ? $('.modal-body', e) : null; },
  setBody(id, html) { const b = this.body(id); if (b) b.innerHTML = html; return b; },
  setTitle(id, t) { const e = this.el(id); const h = e && $('.modal-title h3', e); if (h) h.textContent = t; },
  setSub(id, html) { const e = this.el(id); const s = e && $('.modal-sub', e); if (s) s.innerHTML = html; },
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Modal.top()) Modal.close(Modal.top().id); });

/* ── Live: перерисовка «живых» кусков (чаты и т.п.) при изменении данных ── */
const Live = {
  fns: new Map(),
  add(k, f) { this.fns.set(k, f); }, remove(k) { this.fns.delete(k); },
  run() { this.fns.forEach(f => { try { f(); } catch (e) { console.error(e); } }); },
};

/* ── Chat: универсальный компонент чата ──
   cfg: { me:'user'|'admin'|'courier', get:()=>({messages,disabled,note,quick}), send:async text=>{}, placeholder, who:(m,side)=>string }
   BACKEND: get() читает из подписки (WebSocket / Firestore onSnapshot), send() шлёт на сервер.    */
const Chat = {
  mount(host, cfg) {
    host.innerHTML = `<div class="chat"><div class="chat-msgs" role="log" aria-live="polite"></div><div class="chat-note" hidden></div><div class="chat-quick" hidden></div><form class="chat-form" autocomplete="off"><input class="chat-input" type="text" maxlength="500" enterkeyhint="send" placeholder="${esc(cfg.placeholder || 'Напишите сообщение...')}" aria-label="Сообщение"><button class="send-btn" type="submit" aria-label="Отправить">${icon('send', 20)}</button></form></div>`;
    const msgs = $('.chat-msgs', host), note = $('.chat-note', host), quick = $('.chat-quick', host), form = $('.chat-form', host), input = $('.chat-input', host), btn = $('.send-btn', host);
    let sig = '', first = true, busy = false;
    const doSend = async text => {
      if (busy || !text.trim()) return; busy = true; btn.disabled = true;
      try { await cfg.send(text.trim()); } catch (e) { Toast.error(e.message || 'Не удалось отправить'); input.value = text; }
      busy = false; btn.disabled = false; paint(true); input.focus();
    };
    form.addEventListener('submit', e => { e.preventDefault(); const v = input.value; if (!v.trim() || (cfg.get().disabled)) return; input.value = ''; doSend(v); });
    quick.addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) { if (cfg.fill) { input.value = b.dataset.q; input.focus(); } else doSend(b.dataset.q); } });
    function paint(force) {
      const st = cfg.get();
      const s = JSON.stringify([st.messages.map(m => m.id), st.disabled, st.note, st.quick]);
      if (s === sig && !force) return; sig = s;
      const near = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 90;
      msgs.innerHTML = st.messages.map(m => {
        if (m.from === 'system') return `<div class="msg system"><span>${esc(m.text)}</span></div>`;
        const side = m.from === cfg.me ? 'me' : 'them';
        const who = cfg.who ? cfg.who(m, side) : (side === 'me' ? '' : m.name || '');
        return `<div class="msg ${side}"><div class="bubble">${esc(m.text)}</div><div class="meta">${who ? esc(who) + ' · ' : ''}${fmtTime(m.ts)}</div></div>`;
      }).join('');
      if (near || first) msgs.scrollTop = msgs.scrollHeight;
      first = false;
      note.hidden = !st.note; note.textContent = st.note || '';
      quick.hidden = !(st.quick && st.quick.length);
      quick.innerHTML = (st.quick || []).map(q => `<button type="button" class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('');
      input.disabled = !!st.disabled; btn.disabled = !!st.disabled || busy;
      input.placeholder = st.disabled ? (st.disabledPlaceholder || 'Чат недоступен') : (cfg.placeholder || 'Напишите сообщение...');
    }
    paint(true);
    return { paint, focus: () => input.focus() };
  },
};

/* ── Окно поддержки заказчика/гостя ── */
const SupportUI = {
  open() {
    const actor = Sel.supportActor();
    const sub = () => {
      const t = Sel.activeTicketFor(actor.id);
      return t ? `<span class="mono">#${t.id}</span> · <span class="mono">${esc(actor.tag)}</span> · ${ticketPill(t.status)}` : `<span class="mono">${esc(actor.tag)}</span> · новое обращение`;
    };
    Modal.open({
      id: 'support', title: 'Поддержка Moggs', sub: sub(), size: 'chat', html: '<div class="chat-host"></div>',
      onMount: el => {
        const chat = Chat.mount($('.chat-host', el), {
          me: 'user', placeholder: 'Напишите сообщение...',
          get: () => {
            const t = Sel.activeTicketFor(actor.id);
            const greet = { id: 'greet', from: 'admin', name: 'Поддержка Moggs', text: 'Здравствуйте! Это поддержка Moggs Delivery 👋 Опишите вашу проблему — мы ответим в ближайшие минуты.', ts: t && t.messages[0] ? t.messages[0].ts - 1000 : Date.now() };
            const msgs = t ? [greet, ...t.messages] : [greet];
            const closed = t && t.status === 'closed';
            return { messages: msgs, disabled: false, note: closed ? `Обращение #${t.id} закрыто. Напишите сообщение — мы создадим новое.` : '', quick: t && !closed ? [] : ['Где мой заказ?', 'Проблема с оплатой', 'Хочу изменить адрес', 'Другой вопрос'] };
          },
          send: text => Api.support.send(actor, text),
          who: (m, side) => side === 'me' ? '' : 'Поддержка',
        });
        Live.add('support', () => {
          const t = Sel.activeTicketFor(actor.id);
          if (t && t.userUnread) Api.support.markRead(t.id, 'user');
          chat.paint(); Modal.setSub('support', sub());
          Bus.emit('support-badge');
        });
        const t = Sel.activeTicketFor(actor.id); if (t && t.userUnread) Api.support.markRead(t.id, 'user');
        Modal.setSub('support', sub()); chat.focus();
      },
      onClose: () => { Live.remove('support'); Bus.emit('support-badge'); },
    });
  },
};
</script>
<script>

/* ════════════════════════════════════════════════════════════════
   4. AUTH — главная страница, регистрация, вход, SMS-код
   ════════════════════════════════════════════════════════════════ */
const HomeView = {
  render() {
    const photos = CONFIG.heroImages.map((p, i) => `
      <figure class="ph ph-${i + 1}">
        <div class="ph-fb" style="--h:${p.hue}"><span>${p.emoji}</span></div>
        <img src="${esc(p.src)}" alt="" referrerpolicy="no-referrer" loading="eager" onerror="this.remove()">
      </figure>`).join('');
    $('#app').innerHTML = `
    <div class="home">
      <div class="home-top">
        <nav class="pill-nav" aria-label="Главное меню">
          <a class="wordmark" href="#/">${logo(26)}<span>Moggs Delivery</span></a>
          <div class="pill-links">
            <button data-action="howItWorks">Как это работает</button>
            <button data-action="authCourier">Курьерам</button>
            <button data-action="authAdmin">Для сотрудников</button>
          </div>
        </nav>
      </div>
      <button class="support-corner" data-action="openSupport" aria-label="Поддержка">${icon('lifebuoy', 18)}<span>Поддержка</span><i class="dot-badge" data-sup-badge hidden></i></button>

      <main class="home-main">
        <span class="eyebrow">🛵 Доставка еды за 35 минут</span>
        <div class="hero-logo">${logo(76)}</div>
        <h1 class="hero-title">Moggs Delivery</h1>
        <p class="lead">Свежая еда из лучших кухонь города — горячей и вовремя, прямо к вашей двери.</p>
        <h2 class="ask">Выберите, кто вы</h2>
        <div class="roles">
          <button class="role-btn role-primary" data-action="authCustomer"><span class="role-ic">🍽️</span><span class="role-tx"><b>Заказчик</b><small>Заказать еду</small></span><span class="role-arr">${icon('chevron', 20)}</span></button>
          <button class="role-btn" data-action="authCourier"><span class="role-ic">🛵</span><span class="role-tx"><b>Курьер</b><small>Доставлять еду</small></span><span class="role-arr">${icon('chevron', 20)}</span></button>
        </div>
        <div class="home-links"><button data-action="howItWorks">Как это работает</button><button data-action="authAdmin">Вход для сотрудников</button></div>
      </main>
      <div class="rail" aria-hidden="true">${photos}</div>
    </div>`;
    HomeView.refresh();
  },
  refresh() {
    const n = Sel.userUnread(Guest.get().id), b = $('[data-sup-badge]');
    if (b) { b.hidden = !n; b.textContent = n || ''; }
  },
};

/* ── формы ── */
const fld = o => `<div class="field ${o.span ? 'span-' + o.span : ''}" data-field="${o.name}"><label for="f-${o.name}">${o.label}</label><input id="f-${o.name}" name="${o.name}" type="${o.type || 'text'}" placeholder="${esc(o.ph || '')}" ${o.ac ? `autocomplete="${o.ac}"` : 'autocomplete="off"'} ${o.im ? `inputmode="${o.im}"` : ''} ${o.max ? `maxlength="${o.max}"` : ''} ${o.min != null ? `min="${o.min}"` : ''} value="${esc(o.value || '')}"><div class="field-error" role="alert"></div></div>`;
function showErrors(form, errors) {
  $$('.field', form).forEach(f => {
    const e = errors[f.dataset.field]; f.classList.toggle('error', !!e);
    const box = $('.field-error', f); if (box) box.textContent = e || '';
  });
  $$('.group-error', form).forEach(g => { const e = errors[g.dataset.group]; g.textContent = e || ''; g.hidden = !e; });
  const first = Object.keys(errors)[0];
  if (first) { const el = form.querySelector(`[name="${first}"]`) || form.querySelector(`[data-group="${first}"]`); if (el && el.focus) el.focus({ preventScroll: false }); (el || form).scrollIntoView?.({ block: 'center', behavior: 'smooth' }); }
}
const formData = form => Object.fromEntries(new FormData(form).entries());
function setBusy(btn, busy, label) { if (!btn) return; btn.disabled = busy; if (label) btn.dataset.label = btn.dataset.label || btn.innerHTML; btn.innerHTML = busy ? '<span class="spin"></span> Подождите…' : (btn.dataset.label || btn.innerHTML); }

const AuthUI = {
  role: null, tab: 'register', draft: {}, timer: null,

  open(role, tab) {
    this.role = role; this.tab = tab || (role === 'admin' ? 'login' : 'register'); this.draft = {};
    const titles = { customer: 'Заказчик', courier: 'Курьер', admin: 'Вход для сотрудников' };
    Modal.open({ id: 'auth', title: titles[role], size: role === 'courier' ? 'lg' : 'md', html: '', onClose: () => this.stopTimer(), onMount: () => this.paint() });
  },
  tabs() {
    if (this.role === 'admin') return '';
    return `<div class="seg" role="tablist"><button role="tab" class="${this.tab === 'register' ? 'on' : ''}" data-action="authTab" data-tab="register">Регистрация</button><button role="tab" class="${this.tab === 'login' ? 'on' : ''}" data-action="authTab" data-tab="login">Вход</button></div>`;
  },
  paint() {
    const r = this.role, v = this.draft; let body = '';
    if (r === 'admin') body = this.adminForm();
    else if (this.tab === 'login') body = this.loginForm();
    else body = r === 'customer' ? this.customerForm(v) : this.courierForm(v);
    Modal.setBody('auth', this.tabs() + body);
    const f = $('form', Modal.el('auth')); const ph = f && $('input[name="phone"]', f); if (ph) phoneMask(ph);
    const fi = f && $('input[type=file]', f); if (fi) this.bindFile(fi);
    const slot = f && $$('input[name="workTime"]', f); if (slot && slot.length) this.bindSlots(f);
    this.bindPw(f);
  },
  bindPw(f) { $$('[data-toggle-pw]', f || document).forEach(b => b.addEventListener('click', () => { const i = b.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; b.textContent = i.type === 'password' ? 'Показать' : 'Скрыть'; })); },
  pwFields(v = {}) {
    const pw = (name, label, ac) => `<div class="field" data-field="${name}"><label for="f-${name}">${label}</label><div class="pw"><input id="f-${name}" name="${name}" type="password" autocomplete="${ac}" placeholder="Минимум 6 символов" value="${esc(v[name] || '')}"><button type="button" class="pw-toggle" data-toggle-pw tabindex="-1">Показать</button></div><div class="field-error" role="alert"></div></div>`;
    return pw('password', 'Пароль', 'new-password') + pw('password2', 'Повтор пароля', 'new-password');
  },

  customerForm(v) {
    return `<form data-form="regCustomer" novalidate>
      <div class="grid2">
        ${fld({ name: 'name', label: 'Имя <em>(необязательно)</em>', ph: 'Как к вам обращаться', ac: 'given-name', value: v.name, span: 2 })}
        ${fld({ name: 'phone', label: 'Номер телефона', type: 'tel', ph: '+7 (___) ___-__-__', ac: 'tel', im: 'tel', value: v.phone, span: 2 })}
        ${this.pwFields(v)}
      </div>
      <p class="muted-p" style="margin:-4px 0 14px">Адрес доставки укажете при оформлении заказа.</p>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Зарегистрироваться</button>
    </form>`;
  },
  courierForm(v) {
    const tr = TRANSPORTS.map(t => `<label class="chip-radio"><input type="radio" name="transport" value="${t.id}" ${v.transport === t.id ? 'checked' : ''}><span>${t.emoji} ${t.name}</span></label>`).join('');
    const ws = WORK_SLOTS.map(s => `<label class="chip-radio"><input type="radio" name="workTime" value="${s}" ${v.workTime === s ? 'checked' : ''}><span>${s}</span></label>`).join('');
    return `<form data-form="regCourier" novalidate>
      <div class="grid2">
        ${fld({ name: 'name', label: 'Имя', ph: 'Как вас зовут', ac: 'given-name', value: v.name })}
        ${fld({ name: 'age', label: 'Возраст', type: 'number', ph: '18+', im: 'numeric', min: 18, value: v.age })}
        ${fld({ name: 'phone', label: 'Номер телефона', type: 'tel', ph: '+7 (___) ___-__-__', ac: 'tel', im: 'tel', value: v.phone, span: 2 })}
        ${this.pwFields(v)}
      </div>
      <div class="group"><div class="group-label">Транспорт</div><div class="chips">${tr}</div><div class="group-error" data-group="transport" hidden></div></div>
      <div class="group"><div class="group-label">Подтверждение личности <em>(фото документа/лица или видео)</em></div>
        <label class="drop" data-drop><input type="file" name="doc" accept="image/*,video/*" hidden>
          <span class="drop-ic">${icon('upload', 26)}</span><span class="drop-tx"><b>Загрузить файл</b><small>Фото или видео</small></span>
          <span class="drop-prev" hidden></span></label>
        <div class="group-error" data-group="doc" hidden></div></div>
      <div class="group"><div class="group-label">Время работы</div><div class="chips">${ws}</div>
        <div class="custom-time" hidden><label>С <input type="time" name="from" value="09:00"></label><label>До <input type="time" name="to" value="21:00"></label></div>
        <div class="group-error" data-group="workTime" hidden></div></div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Зарегистрироваться</button>
    </form>`;
  },
  loginForm() {
    const isC = this.role === 'customer';
    return `<form data-form="${isC ? 'loginCustomer' : 'loginCourier'}" novalidate>
      <div class="grid2">
        ${fld({ name: 'login', label: 'Телефон или логин', ph: 'Логин или номер телефона', ac: 'username', span: 2 })}
        <div class="field span-2" data-field="password"><label for="f-password">Пароль</label><div class="pw"><input id="f-password" name="password" type="password" autocomplete="current-password" placeholder="Ваш пароль"><button type="button" class="pw-toggle" data-toggle-pw tabindex="-1">Показать</button></div><div class="field-error" role="alert"></div></div>
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Войти</button>
    </form>`;
  },
  adminForm() {
    return `<form data-form="loginAdmin" novalidate>
      <p class="muted-p">Панель администратора: заказы, курьеры, поддержка и доставки.</p>
      <div class="grid2">
        ${fld({ name: 'login', label: 'Логин', ph: 'Ваш логин', ac: 'username', span: 2 })}
        <div class="field span-2" data-field="password"><label for="f-password">Пароль</label><div class="pw"><input id="f-password" name="password" type="password" autocomplete="current-password" placeholder="Пароль"><button type="button" class="pw-toggle" data-toggle-pw tabindex="-1">Показать</button></div><div class="field-error" role="alert"></div></div>
      </div>
      <button class="btn btn-dark btn-lg btn-block" type="submit">Войти в панель</button>
    </form>`;
  },

  bindFile(input) {
    const drop = input.closest('[data-drop]'), prev = $('.drop-prev', drop);
    input.addEventListener('change', () => {
      const f = input.files[0];
      if (!f) { prev.hidden = true; drop.classList.remove('has'); return; }
      drop.classList.add('has'); prev.hidden = false;
      const mb = (f.size / 1048576).toFixed(1);
      const thumb = f.type.startsWith('image/') ? `<img src="${URL.createObjectURL(f)}" alt="">` : '<span class="vid">🎬</span>';
      prev.innerHTML = `${thumb}<span><b>${esc(f.name)}</b><small>${mb} МБ · нажмите, чтобы заменить</small></span>`;
      $('.drop-tx', drop).hidden = true; $('.drop-ic', drop).hidden = true;
    });
  },
  bindSlots(form) {
    const box = $('.custom-time', form);
    $$('input[name="workTime"]', form).forEach(r => r.addEventListener('change', () => { box.hidden = r.value !== 'Свой график' || !r.checked; }));
    const cur = $('input[name="workTime"]:checked', form); if (cur && cur.value === 'Свой график') box.hidden = false;
  },

  /* ── шаг SMS ── */
  showSms(phone) {
    Modal.setTitle('auth', 'Подтверждение телефона');
    Modal.setBody('auth', `
      <div class="sms">
        <button class="link-btn back" type="button" data-action="smsBack">${icon('back', 16)} Изменить данные</button>
        <div class="sms-ic">💬</div>
        <h3 class="sms-h">Введите 4-значный код из SMS</h3>
        <p class="muted-p">Мы отправили код на <b>${esc(fmtPhone(phone))}</b></p>
        <form data-form="sms" novalidate>
          <div class="otp-row" role="group" aria-label="Код из SMS">${[0, 1, 2, 3].map(i => `<input class="otp" inputmode="numeric" maxlength="1" autocomplete="${i ? 'off' : 'one-time-code'}" aria-label="Цифра ${i + 1}">`).join('')}</div>
          <div class="otp-err" role="alert" hidden></div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">Подтвердить</button>
        </form>
        <button class="btn btn-ghost btn-block" type="button" data-action="resendSms" disabled>Отправить код повторно</button>
      </div>`);
    const row = $('.otp-row', Modal.el('auth')), ins = $$('.otp', row);
    ins.forEach((el, i) => {
      el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, '').slice(-1); el.classList.toggle('filled', !!el.value); if (el.value && ins[i + 1]) ins[i + 1].focus(); $('.otp-err', Modal.el('auth')).hidden = true; });
      el.addEventListener('keydown', e => { if (e.key === 'Backspace' && !el.value && ins[i - 1]) { ins[i - 1].focus(); ins[i - 1].value = ''; ins[i - 1].classList.remove('filled'); } if (e.key === 'ArrowLeft' && ins[i - 1]) ins[i - 1].focus(); if (e.key === 'ArrowRight' && ins[i + 1]) ins[i + 1].focus(); });
      el.addEventListener('paste', e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4); if (!t) return; e.preventDefault(); t.split('').forEach((c, k) => { ins[k].value = c; ins[k].classList.add('filled'); }); (ins[Math.min(t.length, 3)]).focus(); });
      el.addEventListener('focus', () => el.select());
    });
    ins[0].focus();
    this.startTimer();
  },
  startTimer() {
    this.stopTimer(); let left = CONFIG.smsResendSeconds;
    const btn = () => { const m = Modal.el('auth'); return m && $('[data-action="resendSms"]', m); };
    const tick = () => { const b = btn(); if (!b) return this.stopTimer(); if (left > 0) { b.disabled = true; b.textContent = `Отправить код повторно (0:${pad(left)})`; left--; } else { b.disabled = false; b.textContent = 'Отправить код повторно'; this.stopTimer(); } };
    tick(); this.timer = setInterval(tick, 1000);
  },
  stopTimer() { if (this.timer) clearInterval(this.timer); this.timer = null; },
};

/* ── валидация ── */
function validatePasswords(v, e) {
  if (!v.password || v.password.length < 6) e.password = 'Минимум 6 символов';
  if (v.password2 !== v.password) e.password2 = 'Пароли не совпадают';
}
function validateCustomer(v) {
  const e = {};
  if (!normPhone(v.phone)) e.phone = 'Введите номер полностью: +7 (XXX) XXX-XX-XX';
  validatePasswords(v, e); return e;
}
function validateCourier(v, form) {
  const e = {};
  if (!v.name.trim()) e.name = 'Укажите имя';
  const age = +v.age; if (!age || age < 18 || age > 70) e.age = 'От 18 до 70 лет';
  if (!normPhone(v.phone)) e.phone = 'Введите номер полностью';
  validatePasswords(v, e);
  if (!v.transport) e.transport = 'Выберите транспорт';
  if (!v.workTime) e.workTime = 'Выберите время работы';
  else if (v.workTime === 'Свой график' && (!v.from || !v.to)) e.workTime = 'Укажите начало и конец смены';
  return e;
}

/* ── обработчики форм ── */
const Forms = {
  async regCustomer(form) {
    const v = formData(form), errors = validateCustomer(v); showErrors(form, errors);
    if (Object.keys(errors).length) return;
    const btn = $('[type=submit]', form); setBusy(btn, true, true);
    try { AuthUI.draft = v; const r = await Api.auth.startRegistration('customer', v); AuthUI.showSms(r.phone); }
    catch (err) { setBusy(btn, false); showErrors(form, { phone: err.message }); }
  },
  async regCourier(form) {
    const v = formData(form); v.docName = (form.querySelector('input[type=file]').files[0] || {}).name || '';
    if (v.workTime === 'Свой график') v.workTime = `${v.from}–${v.to}`;
    const raw = formData(form); const errors = validateCourier(raw, form); showErrors(form, errors);
    if (Object.keys(errors).length) return;
    const btn = $('[type=submit]', form); setBusy(btn, true, true);
    try { AuthUI.draft = { ...raw, workTime: raw.workTime }; const r = await Api.auth.startRegistration('courier', v); AuthUI.showSms(r.phone); }
    catch (err) { setBusy(btn, false); showErrors(form, { phone: err.message }); }
  },
  async sms(form) {
    const code = $$('.otp', form).map(i => i.value).join(''), err = $('.otp-err', Modal.el('auth')), row = $('.otp-row', form);
    const fail = m => { err.textContent = m; err.hidden = false; row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); };
    if (code.length < 4) return fail('Введите все 4 цифры');
    const btn = $('[type=submit]', form); setBusy(btn, true, true);
    try {
      const u = await Api.auth.confirmSms(code);
      Modal.setBody('auth', `<div class="sms ok-anim"><div class="check-anim">${icon('check', 40)}</div><h3 class="sms-h">Телефон подтверждён!</h3><p class="muted-p">Добро пожаловать в Moggs Delivery, ${esc(u.name)}</p></div>`);
      setTimeout(() => { Modal.close('auth'); Router.go(u.role === 'courier' ? '#/courier' : '#/menu'); Toast.show(`Ваш тег: ${u.tag}`, { icon: '🎉', title: 'Регистрация завершена' }); }, 900);
    } catch (e) { setBusy(btn, false); fail(e.message); $$('.otp', form).forEach(i => { i.value = ''; i.classList.remove('filled'); }); $$('.otp', form)[0].focus(); }
  },
  async loginCustomer(form) { return Forms._login(form, 'customer'); },
  async loginCourier(form) { return Forms._login(form, 'courier'); },
  async loginAdmin(form) { return Forms._login(form, 'admin'); },
  async _login(form, role) {
    const v = formData(form), e = {};
    if (!(v.login || '').trim()) e.login = role === 'admin' ? 'Введите логин' : 'Введите телефон или логин';
    if (!v.password) e.password = 'Введите пароль';
    showErrors(form, e); if (Object.keys(e).length) return;
    const btn = $('[type=submit]', form); setBusy(btn, true, true);
    try {
      const u = await Api.auth.login({ role, login: v.login, password: v.password });
      Modal.close('auth'); Router.go(role === 'admin' ? '#/admin' : role === 'courier' ? '#/courier' : '#/menu');
      Toast.show(`Вы вошли как ${u.tag}`, { icon: '👋', title: `Привет, ${u.name}!` });
    } catch (err) { setBusy(btn, false); showErrors(form, { password: err.message }); }
  },
};

/* ── «Как это работает» ── */
function openHowItWorks() {
  Modal.open({
    id: 'how', title: 'Как работает Moggs', size: 'md', html: `
    <div class="how">
      <div class="how-card"><span>1</span><div><b>Выбираете блюда</b><p>13 категорий: от завтраков и пасты до кофе и чая.</p></div></div>
      <div class="how-card"><span>2</span><div><b>Оформляете заказ</b><p>Подтверждаете адрес и способ оплаты — заказ сразу уходит на кухню.</p></div></div>
      <div class="how-card"><span>3</span><div><b>Следите за доставкой</b><p>Шесть понятных статусов и информация о курьере в реальном времени.</p></div></div>
      <div class="how-card"><span>4</span><div><b>Поддержка рядом</b><p>Чат с поддержкой доступен на любой странице — ответим за пару минут.</p></div></div>
      <div class="how-actions"><button class="btn btn-primary" data-action="authCustomer">Я заказчик</button><button class="btn btn-ghost" data-action="authCourier">Я курьер</button></div>
    </div>`,
  });
}
</script>
<script>

/* ════════════════════════════════════════════════════════════════
   5. CUSTOMER — меню, корзина, оформление, отслеживание, профиль
   ════════════════════════════════════════════════════════════════ */
const dishHue = d => (Catalog.cat(d.cat) || { hue: 20 }).hue;

const CustomerView = {
  route: { name: 'menu' },
  _seen: {},

  render(seg) {
    Cart.load();
    ExtrasSync.settle();
    const route = seg[0] === 'orders' ? (seg[1] ? { name: 'track', id: seg[1] } : { name: 'orders' }) : seg[0] === 'favorites' ? { name: 'favorites' } : seg[0] === 'bonuses' ? { name: 'bonuses' } : { name: 'menu' };
    this.route = route;
    const me = Sel.me(), a = me.address, q = App.state.query;
    const tab = (name, href, ic, label) => `<a class="tab ${route.name === name || (name === 'orders' && route.name === 'track') ? 'on' : ''}" href="${href}">${icon(ic, 22)}<span>${label}</span></a>`;
    $('#app').innerHTML = `
    <div class="cust">
      <header class="c-head"><div class="c-head-in">
        <a class="brand" href="#/menu" aria-label="Moggs Delivery — меню">${logo(36)}<span>Moggs Delivery</span></a>
        <nav class="c-nav hide-m"><a class="${route.name === 'menu' ? 'on' : ''}" href="#/menu">Меню</a><a class="${route.name === 'favorites' ? 'on' : ''}" href="#/favorites">Избранное<i class="nav-pill" data-fav-count hidden></i></a><a class="${route.name === 'bonuses' ? 'on' : ''}" href="#/bonuses">Бонусы<i class="nav-pill gold" data-bonus-bal></i></a><a class="${route.name === 'orders' || route.name === 'track' ? 'on' : ''}" href="#/orders">Мои заказы</a></nav>
        <label class="search">${icon('search', 18)}<input id="search" type="search" placeholder="Поиск блюд…" value="${esc(q)}" autocomplete="off" aria-label="Поиск блюд"><button type="button" class="search-clear" data-action="clearSearch" aria-label="Очистить" ${q ? '' : 'hidden'}>${icon('x', 16)}</button></label>
        <div class="c-actions">
          <button class="icon-btn sup-btn" data-action="openSupport" aria-label="Поддержка" title="Поддержка">${icon('lifebuoy', 20)}<i class="dot-badge" data-sup-badge hidden></i></button>
          <button class="profile-btn hide-m" data-action="openProfile" aria-label="Профиль">${avatar(me.name)}<span class="pf-tx"><b>${esc(me.name)}</b><small>${esc(me.tag)}</small></span></button>
          <button class="btn btn-primary cart-btn" data-action="openCart" aria-label="Корзина">${icon('bag', 20)}<span class="hide-m">Корзина</span><span class="cart-total hide-m" data-cart-total></span><span class="cart-count" data-cart-count hidden>0</span></button>
        </div>
      </div></header>
      <main class="c-main">${this.main(me, route, a)}</main>
      <nav class="tabbar" aria-label="Навигация">
        ${tab('menu', '#/menu', 'home', 'Меню')}${tab('favorites', '#/favorites', 'heart', 'Избранное')}${tab('orders', '#/orders', 'receipt', 'Заказы')}${tab('bonuses', '#/bonuses', 'gift', 'Бонусы')}
        <button class="tab" data-action="openProfile">${icon('user', 22)}<span>Профиль</span></button>
      </nav>
      <button class="cart-bar" data-action="openCart" hidden></button>
    </div>`;
    this.bindSearch();
    this.paintBadges();
    /* при первом заходе на экран — короткий скелетон вместо «мигания» */
    const first = !this._seen[route.name]; this._seen[route.name] = 1;
    if (route.name === 'menu') { if (first && !App.state.query) Skel.defer($('#grid'), Skel.cards(6), () => this.paintGrid(), 520); else this.paintGrid(); }
    if (route.name === 'orders') { if (first) Skel.defer($('#orders-list'), Skel.rows(3), () => this.paintOrders(), 320); else this.paintOrders(); }
    if (route.name === 'track') this.paintTrack();
    if (route.name === 'favorites') { if (first) Skel.defer($('#fav-list'), Skel.cards(3), () => this.paintFavs(), 320); else this.paintFavs(); }
    if (route.name === 'bonuses') { if (first) Skel.defer($('#bonus-host'), Skel.bonus(), () => this.paintBonuses(), 380); else this.paintBonuses(); }
  },

  main(me, route, a) {
    if (route.name === 'menu') {
      const cur = App.state.category;
      const chips = `<button class="cat ${cur === 'all' ? 'on' : ''}" data-action="setCategory" data-cat="all">✨ Все</button>` +
        CATEGORIES.map(c => `<button class="cat ${cur === c.id ? 'on' : ''}" data-action="setCategory" data-cat="${c.id}">${c.emoji} ${c.name}</button>`).join('');
      return `
      <section class="greet"><div><h1>Привет, ${esc(me.name)}! 👋</h1><p>Что закажем сегодня?</p></div>
        <button class="addr-chip" data-action="openProfile">${icon('pin', 16)}<span>${a ? esc(addrLine(a)) : 'Адрес укажете при заказе'}</span>${icon('chevron', 14)}</button></section>
      <div class="cats-wrap"><div class="cats" id="cats" role="tablist">${chips}</div></div>
      <div id="grid"></div>`;
    }
    if (route.name === 'favorites') return `<section class="page-head"><h1>Избранное</h1><p id="fav-sub">Блюда, которые вы любите</p></section><div id="fav-list"></div>`;
    if (route.name === 'bonuses') return `<section class="page-head"><h1>Бонусы</h1><p>Копите баллы с каждого заказа и тратьте на новые</p></section><div id="bonus-host"></div>`;
    if (route.name === 'orders') return `<section class="page-head"><h1>Мои заказы</h1><p>История и текущие доставки</p></section><div id="orders-list"></div>`;
    return `<a class="back-link" href="#/orders">${icon('back', 18)} Все заказы</a><div id="track"></div>`;
  },

  bindSearch() {
    const i = $('#search'); if (!i) return;
    i.addEventListener('input', () => {
      App.state.query = i.value; const c = $('.search-clear'); if (c) c.hidden = !i.value;
      if (this.route.name !== 'menu') { Router.go('#/menu'); setTimeout(() => { const n = $('#search'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 60); }
      else this.paintGrid();
    });
  },

  /* ── меню ── */
  dishCard(d) {
    const q = Cart.qty(d.id);
    const warm = WARM_CATS.includes(d.cat);
    return `<article class="dish" data-dish="${d.id}"${warm ? ' data-warm' : ''}>
      <div class="dish-photo" style="--h:${dishHue(d)}">
        ${d.photo ? `<img src="${esc(d.photo)}" alt="${esc(d.name)}" loading="lazy" onerror="phFail(this)">` : ''}
        <span class="plate" aria-hidden="true">${d.emoji}</span>
        ${warm ? '<span class="steam" aria-hidden="true"><i></i><i></i><i></i></span>' : ''}
        ${d.badge ? `<span class="dish-badge">${esc(d.badge)}</span>` : ''}
        <span class="qty-badge" ${q ? '' : 'hidden'}>×${q}</span>
        <button type="button" class="dish-open" data-action="openDish" data-id="${d.id}" tabindex="-1" aria-hidden="true"></button>
        ${FavUI.btn(d.id, Extras.fav.has(d.id))}
      </div>
      <div class="dish-body">
        <div class="dish-top"><h3><button type="button" class="dish-name" data-action="openDish" data-id="${d.id}">${esc(d.name)}</button></h3><span class="dish-w">${esc(d.weight)}</span></div>
        <p>${esc(d.desc)}</p>
        <div class="dish-foot"><span class="price">${money(d.price)}</span><span class="rate-slot">${RecUI.rate(d.id)}</span></div>
        <div class="dish-act">${this.dishAct(d.id, q)}</div>
      </div></article>`;
  },
  dishAct(id, q) {
    return q
      ? `<div class="stepper"><button data-action="decCart" data-id="${id}" aria-label="Убрать одну порцию">${icon('minus', 18)}</button><span aria-live="polite">${q}</span><button data-action="incCart" data-id="${id}" aria-label="Добавить ещё">${icon('plus', 18)}</button></div>`
      : `<button class="btn btn-primary btn-block" data-action="addToCart" data-id="${id}">${icon('plus', 18)} Добавить в корзину</button>`;
  },
  paintGrid() {
    const host = $('#grid'); if (!host) return;
    const q = App.state.query.trim().toLowerCase(), cat = App.state.category;
    let html = '';
    if (q) {
      const list = DISHES.filter(d => (d.name + ' ' + d.desc).toLowerCase().includes(q));
      html = `<div class="sec-head"><h2>Результаты поиска</h2><span>${list.length} найдено</span></div>` +
        (list.length ? `<div class="grid">${list.map(d => this.dishCard(d)).join('')}</div>` : `<div class="empty"><div class="empty-ic">🔍</div><h3>Ничего не нашли</h3><p>Попробуйте другое слово, например «бургер» или «кофе».</p><button class="btn btn-ghost" data-action="clearSearch">Сбросить поиск</button></div>`);
    } else if (cat === 'all') {
      const seeds = Cart.items.map(i => i.id), recs = Extras.recs({ seeds, exclude: seeds, limit: 8 });
      const hasHist = Sel.me() && Sel.customerOrders(Sel.me().id).length;
      html = PromoUI.strip() + RecUI.strip('Вам может понравиться', seeds.length ? 'К вашей корзине' : hasHist ? 'На основе ваших заказов' : 'Хиты Moggs', recs) + CATEGORIES.map(c => `<section class="sec" id="sec-${c.id}"><div class="sec-head"><h2>${c.emoji} ${c.name}</h2><button class="link-btn" data-action="setCategory" data-cat="${c.id}">Смотреть все</button></div><div class="grid">${DISHES.filter(d => d.cat === c.id).map(d => this.dishCard(d)).join('')}</div></section>`).join('');
    } else {
      const c = Catalog.cat(cat), list = DISHES.filter(d => d.cat === cat);
      html = `<div class="sec-head"><h2>${c.emoji} ${c.name}</h2><span>${list.length} блюд</span></div><div class="grid">${list.map(d => this.dishCard(d)).join('')}</div>`;
    }
    host.innerHTML = html;
    $$('.cat', $('#cats')).forEach(b => b.classList.toggle('on', !q && b.dataset.cat === cat));
    const on = $('.cat.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  },

  /* ── корзина: события ── */
  onCart() {
    this.paintBadges();
    $$('.dish[data-dish]').forEach(card => {
      const q = Cart.qty(card.dataset.dish), act = $('.dish-act', card), qb = $('.qty-badge', card);
      const html = this.dishAct(card.dataset.dish, q);
      if (act.dataset.q !== String(q)) { act.innerHTML = html; act.dataset.q = q; }
      qb.hidden = !q; qb.textContent = '×' + q;
    });
    RecUI.sync(); DishUI.sync();
    if (Modal.isOpen('cart')) CartUI.paint();
    if (Modal.isOpen('checkout') && !Cart.count()) { /* корзина очищена — закрывать не нужно, заказ мог быть оформлен */ }
    const b = $('.cart-btn'); if (b) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  },
  paintBadges() {
    const n = Cart.count(), t = Cart.total();
    $$('[data-cart-count]').forEach(el => { el.textContent = n; el.hidden = !n; });
    $$('[data-cart-total]').forEach(el => { el.textContent = n ? money(t) : ''; });
    const bar = $('.cart-bar'); if (bar) { bar.hidden = !n; bar.innerHTML = `<span class="cb-l"><i>${n}</i> Корзина</span><b>${money(t)}</b>${icon('chevron', 18)}`; }
    const bal = Extras.bonus.state().balance;
    $$('[data-bonus-bal]').forEach(el => { el.textContent = fmtN(bal); el.hidden = !bal; });
    FavUI.sync();
    const me = Sel.me(); const un = me ? Sel.userUnread(me.id) : 0;
    $$('[data-sup-badge]').forEach(el => { el.hidden = !un; el.textContent = un || ''; });
  },

  refresh() {
    this.paintBadges();
    if (this.route.name === 'orders') this.paintOrders();
    if (this.route.name === 'track') this.paintTrack();
  },

  /* ── избранное ── */
  paintFavs() {
    const host = $('#fav-list'); if (!host) return;
    const ids = Extras.fav.list(), sub = $('#fav-sub');
    if (sub) sub.textContent = ids.length ? `${ids.length} ${plural(ids.length, ['блюдо', 'блюда', 'блюд'])} · сердечко на карточке убирает из списка` : 'Блюда, которые вы любите';
    if (!ids.length) {
      const recs = Extras.recs({ limit: 4 });
      host.innerHTML = `<div class="empty"><div class="empty-ic">🤍</div><h3>Пока ничего нет</h3><p>Нажмите на сердечко на карточке блюда — и оно появится здесь, чтобы заказать в один клик.</p><a class="btn btn-primary" href="#/menu">Выбрать блюда</a></div>` + RecUI.strip('Начните с популярного', '', recs);
      return;
    }
    host.innerHTML = `<div class="fav-bar"><button class="btn btn-primary btn-sm" data-action="addFavs">${icon('bag', 16)} Добавить всё в корзину</button></div><div class="grid">${ids.map(id => this.dishCard(Catalog.get(id))).join('')}</div>`;
  },

  /* ── бонусы ── */
  paintBonuses(soft) {
    const host = $('#bonus-host'); if (!host) return;
    const y = window.scrollY; host.innerHTML = BonusUI.html(); if (soft) window.scrollTo(0, y);
    const bal = $('[data-count]', host), n = bal ? +bal.dataset.count : 0;
    if (bal && n && !soft && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {   // «набегающий» баланс
      const t0 = performance.now(), dur = 800;
      const tick = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); bal.textContent = fmtN(n * e); if (k < 1 && bal.isConnected) requestAnimationFrame(tick); else bal.textContent = fmtN(n); };
      requestAnimationFrame(tick);
    }
  },

  /* ── список заказов ── */
  paintOrders() {
    const host = $('#orders-list'); if (!host) return;
    const me = Sel.me(), list = Sel.customerOrders(me.id);
    if (!list.length) { host.innerHTML = `<div class="empty"><div class="empty-ic">🧾</div><h3>Заказов пока нет</h3><p>Выберите что-нибудь вкусное в меню — и он появится здесь.</p><a class="btn btn-primary" href="#/menu">Перейти в меню</a></div>`; return; }
    const act = list.filter(o => o.status < 5), done = list.filter(o => o.status === 5), toRate = new Set(Extras.reviews.toReview(me.id).map(o => o.id));
    const card = o => {
      const sum = o.items.slice(0, 2).map(i => `${i.qty}× ${esc(i.name)}`).join(', ') + (o.items.length > 2 ? ` и ещё ${o.items.length - 2}` : '');
      return `<article class="order-card ${o.status < 5 ? 'active' : ''}">
        <div class="oc-top"><div><b>Заказ #${o.id}</b><small>${fmtDate(o.createdAt)}</small></div>${statusPill(o.status)}</div>
        <div class="oc-items">${sum}</div>
        ${o.status < 5 ? `<div class="oc-progress"><i style="width:${Math.round((o.status + 1) / 6 * 100)}%"></i></div><div class="oc-eta">${ORDER_STATUSES[o.status].icon} Примерно ${Sel.eta(o)} мин</div>` : ''}
        <div class="oc-foot"><b>${money(o.total)}${o.discount || o.bonusUsed ? `<small class="oc-save">выгода ${money((o.discount || 0) + (o.bonusUsed || 0))}</small>` : ''}</b><div class="oc-btns">${o.status === 5 ? `<button class="btn btn-ghost btn-sm" data-action="openReview" data-id="${o.id}">${icon('star', 15)} ${toRate.has(o.id) ? 'Оценить' : 'Мой отзыв'}</button>` : ''}<button class="btn btn-ghost btn-sm" data-action="repeatOrder" data-id="${o.id}">${icon('repeat', 15)} Повторить</button><a class="btn btn-primary btn-sm" href="#/orders/${o.id}">${o.status === 5 ? 'Детали' : 'Отследить'}</a></div></div></article>`;
    };
    host.innerHTML = (act.length ? `<h3 class="list-h">Активные</h3><div class="order-list">${act.map(card).join('')}</div>` : '') +
      (done.length ? `<h3 class="list-h">Завершённые</h3><div class="order-list">${done.map(card).join('')}</div>` : '');
  },

  /* ── отслеживание ── */
  paintTrack() {
    const host = $('#track'); if (!host) return;
    const me = Sel.me(), o = Sel.order(this.route.id);
    if (!o || o.customerId !== me.id) { host.innerHTML = `<div class="empty"><div class="empty-ic">🤷</div><h3>Заказ не найден</h3><a class="btn btn-primary" href="#/orders">К моим заказам</a></div>`; return; }
    const c = o.courierId ? Sel.user(o.courierId) : null, done = o.status === 5;
    const steps = ORDER_STATUSES.map((s, i) => {
      const isDone = i < o.status || done, cur = i === o.status && !done, h = o.history.find(x => x.status === i);
      return `<li class="step ${isDone ? 'done' : ''} ${cur ? 'cur' : ''}"><span class="dot">${isDone ? icon('check', 16) : s.icon}</span><div class="st-tx"><b>${s.label}</b><small>${s.desc}</small></div><time>${h ? fmtTime(h.ts) : ''}</time></li>`;
    }).join('');
    const tr = c ? transportOf(c.transport) : null;
    host.innerHTML = `
    <div class="track-head">
      <div><h1>Заказ #${o.id}</h1><p>${fmtDate(o.createdAt)} · ${o.items.reduce((s, i) => s + i.qty, 0)} поз. · ${money(o.total)}</p></div>
      ${statusPill(o.status)}
    </div>
    <div class="track-grid">
      <section class="card">
        <div class="eta-row"><div><small>${done ? 'Доставлено в' : 'Примерное время доставки'}</small><div class="eta">${done ? fmtTime(o.deliveredAt) : '≈ ' + Sel.eta(o) + ' мин'}</div></div><div class="eta-ic">${ORDER_STATUSES[o.status].icon}</div></div>
        <div class="bar"><i style="width:${Math.round((o.status + (done ? 0 : .5)) / 5 * 100)}%"></i></div>
        <ol class="timeline">${steps}</ol>
      </section>
      <div class="track-side">
        <section class="card courier-card">
          <h4>Курьер</h4>
          ${c ? `<div class="cc-row">${avatar(c.name, 'lg')}<div class="cc-info"><b>${esc(c.name)}</b><span class="mono">${esc(c.tag)}</span><span>${tr.emoji} ${tr.name} · ⭐ 4.9</span></div></div>
            <div class="cc-eta">${icon('clock', 16)} ${done ? 'Заказ доставлен' : 'Примерно ' + Sel.eta(o) + ' мин до вас'}</div>`
          : `<div class="cc-wait"><div class="pulse-dot"></div><div><b>Курьер ещё не назначен</b><small>Мы назначим его, как только заказ будет готов</small></div></div>`}
        </section>
        <section class="card map-card" aria-hidden="true">${this.mapSvg()}</section>
        <section class="card"><h4>Состав заказа</h4>
          <ul class="mini-items">${o.items.map(i => `<li><span>${i.emoji} ${i.qty} × ${esc(i.name)}</span><b>${money(i.price * i.qty)}</b></li>`).join('')}</ul>
          ${o.discount ? `<div class="mini-sum disc"><span>Скидка (${esc(o.promo || '')})</span><b>−${money(o.discount)}</b></div>` : ''}
          ${o.bonusUsed ? `<div class="mini-sum disc"><span>Оплачено баллами</span><b>−${money(o.bonusUsed)}</b></div>` : ''}
          <div class="mini-sum"><span>Доставка</span><b>${o.fee ? money(o.fee) : 'Бесплатно'}</b></div>
          <div class="mini-sum total"><span>Итого</span><b>${money(o.total)}</b></div>
          <div class="mini-addr">${icon('pin', 16)}<span>${esc(addrLine(o.address))}<br><small>${esc(addrDetails(o.address))} · ${o.payment === 'card' ? '💳 Картой' : '💵 Наличными'}</small></span></div>
        </section>
        <section class="card help-card">
          <h4>Нужна помощь с заказом?</h4><p>Напишите в поддержку — ответим в течение пары минут.</p>
          <div class="btn-row"><button class="btn btn-ghost btn-sm" data-action="openSupport">${icon('lifebuoy', 16)} Поддержка</button></div>
          ${done ? `<button class="btn btn-primary btn-sm btn-block" data-action="repeatOrder" data-id="${o.id}">${icon('repeat', 16)} Повторить заказ</button>` : ''}
        </section>
        ${done ? `<section class="card rate-card"><h4>${icon('star', 18)} Как вам заказ?</h4><p>${Extras.reviews.toReview(me.id).some(x => x.id === o.id) ? 'Оцените блюда — это поможет другим гостям и улучшит рекомендации.' : 'Спасибо за отзыв! Его можно изменить в любой момент.'}</p><button class="btn btn-ghost btn-sm btn-block" data-action="openReview" data-id="${o.id}">${Extras.reviews.toReview(me.id).some(x => x.id === o.id) ? 'Оценить блюда' : 'Изменить отзыв'}</button></section>` : ''}
      </div>
    </div>`;
    const path = $('#route', host), mk = $('#courier-mk', host);
    if (path && mk) {
      const L = path.getTotalLength(), p = [0, 0, 0, .06, .55, 1][o.status], pt = path.getPointAtLength(L * p);
      mk.setAttribute('transform', `translate(${pt.x} ${pt.y})`); $('text', mk).textContent = o.status < 3 ? '👨‍🍳' : '🛵';
      // плавное движение маркера от прошлой позиции (только transform, без layout)
      const prev = this._mk && this._mk.id === o.id ? this._mk : null; this._mk = { id: o.id, x: pt.x, y: pt.y };
      if (prev && (prev.x !== pt.x || prev.y !== pt.y) && mk.animate && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches))
        mk.animate([{ transform: `translate(${prev.x}px, ${prev.y}px)` }, { transform: `translate(${pt.x}px, ${pt.y}px)` }], { duration: 1800, easing: 'cubic-bezier(.22,.8,.24,1)' });
    }
  },
  mapSvg() {
    return `<svg viewBox="0 0 400 210" class="map" role="img" aria-label="Схема маршрута">
      <rect width="400" height="210" fill="#ece6dc"/>
      <g stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".9"><path d="M-10 60 L410 40"/><path d="M-10 150 L410 175"/><path d="M90 -10 L110 220"/><path d="M270 -10 L250 220"/><path d="M-10 105 L410 110" stroke-width="6"/></g>

      <path id="route" d="M45 155 C 120 165, 120 70, 200 82 S 320 110, 360 52" fill="none" stroke="#7b4f33" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" opacity=".9"/>
      <g transform="translate(45 155)"><circle r="17" fill="#fff"/><text text-anchor="middle" dy="6" font-size="18">🍽️</text></g>
      <g transform="translate(360 52)"><circle r="17" fill="#fff"/><text text-anchor="middle" dy="6" font-size="18">🏠</text></g>
      <g id="courier-mk"><circle r="20" fill="#7b4f33" opacity=".2"><animate attributeName="r" values="16;26;16" dur="2s" repeatCount="indefinite"/></circle><circle r="16" fill="#7b4f33"/><text text-anchor="middle" dy="6" font-size="17">🛵</text></g>

};

Object.assign(Forms, {
  async saveAddress(form) {
    const v = formData(form), e = {};
    ADDR_KEYS.forEach(k => { if (!(v[k] || '').trim()) e[k] = ADDR_MSG[k]; });
    showErrors(form, e); if (Object.keys(e).length) return;
    const btn = $('[type=submit]', form); setBusy(btn, true, true);
    const me = Sel.me();
    await Api.users.updateAddress(me.id, { city: v.city.trim(), street: v.street.trim(), house: v.house.trim(), apt: v.apt.trim(), floor: v.floor.trim(), intercom: v.intercom.trim() });
    setBusy(btn, false); Toast.ok('Адрес сохранён', 'Профиль обновлён');
    const chip = $('.addr-chip span'); if (chip) chip.textContent = addrLine(Sel.me().address);
  },
  async checkout(form) {
    const v = formData(form), e = {};
    ADDR_KEYS.forEach(k => { if (!(v[k] || '').trim()) e[k] = ADDR_MSG[k]; });
    if (Object.keys(e).length) { showErrors(form, e); const bad = $('.field.error input', form); if (bad) bad.focus(); return; }
    const items = Cart.lines().map(l => ({ id: l.dish.id, name: l.dish.name, price: l.dish.price, qty: l.qty, emoji: l.dish.emoji }));
    if (!items.length) { Toast.error('Корзина пуста'); return; }
    const btn = $('[type=submit]', form); setBusy(btn, true, true);
    try {
      const promoCode = Extras.promo.state().active, bonusReq = CheckoutUI.bonusReq;
      const address = { city: v.city.trim(), street: v.street.trim(), house: v.house.trim(), apt: v.apt.trim(), floor: v.floor.trim(), intercom: v.intercom.trim() };
      const o = await Api.orders.create(Sel.me().id, { items, payment: v.payment, comment: v.comment, promo: promoCode, bonus: bonusReq, address });
      /* запоминаем адрес в профиле (галочка «Запомнить адрес»; первый заказ — всегда) */
      if (v.saveAddr || !Sel.me().address) { await Api.users.updateAddress(Sel.me().id, address); const chip = $('.addr-chip span'); if (chip) chip.textContent = addrLine(address); }
      /* BACKEND: списание баллов и «погашение» промокода делает сервер в той же транзакции, что и создание заказа */
      Modal.close('checkout', true); CheckoutUI.bonusReq = 0;
      if (o.promo) Extras.promo.consume(o.promo);
      if (o.bonusUsed) Extras.bonus.spend(o.bonusUsed, o.id);
      Cart.clear(); CheckoutUI.success(o);
    } catch (err) { setBusy(btn, false); Toast.error(err.message); }
  },
});

const plural = (n, f) => { n = Math.abs(n) % 100; const d = n % 10; return n > 10 && n < 20 ? f[2] : d > 1 && d < 5 ? f[1] : d === 1 ? f[0] : f[2]; };
