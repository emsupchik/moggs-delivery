const pts = n => `${fmtN(n)} ${plural(n, ['балл', 'балла', 'баллов'])}`;

/* ── скелетоны: короткая «загрузка» при первом входе на экран ── */
const Skel = {
  cards(n = 6) { return `<div class="skel-wrap" aria-hidden="true"><div class="sk sk-h"></div><div class="grid">${Array.from({ length: n }, () => `<article class="dish skel"><div class="dish-photo sk"></div><div class="dish-body"><div class="sk sk-l w60"></div><div class="sk sk-l w90"></div><div class="sk sk-l w40"></div><div class="sk sk-btn"></div></div></article>`).join('')}</div></div>`; },
  rows(n = 3) { return `<div class="skel-wrap" aria-hidden="true">${Array.from({ length: n }, () => `<div class="skel-row"><div class="sk sk-c"></div><div class="skel-col"><div class="sk sk-l w40"></div><div class="sk sk-l w80"></div></div><div class="sk sk-pill"></div></div>`).join('')}</div>`; },
  bonus() { return `<div class="skel-wrap" aria-hidden="true"><div class="sk sk-hero"></div><div class="skel-2"><div class="sk sk-card"></div><div class="sk sk-card"></div></div></div>`; },
  /* показать скелетон, через ms отрисовать настоящее содержимое (если экран ещё тот же) */
  defer(host, skel, fn, ms = 420) {
    if (!host) return;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { fn(); return; }
    host.innerHTML = skel;
    setTimeout(() => { if (host.isConnected && host.querySelector('.skel-wrap')) fn(); }, ms);
  },
};

/* ── избранное ── */
const FavUI = {
  btn(id, on) {
    return `<button type="button" class="fav-btn ${on ? 'on' : ''}" data-action="toggleFav" data-id="${id}" aria-pressed="${on ? 'true' : 'false'}" aria-label="${on ? 'Убрать из избранного' : 'В избранное'}" title="${on ? 'Убрать из избранного' : 'В избранное'}">${icon('heart', 18)}</button>`;
  },
  sync() {
    const set = new Set(Extras.fav.list());
    $$('.fav-btn[data-id]').forEach(b => {
      const on = set.has(b.dataset.id);
      if (b.classList.contains('on') !== on) {
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
        b.setAttribute('aria-label', on ? 'Убрать из избранного' : 'В избранное'); b.title = on ? 'Убрать из избранного' : 'В избранное';
        b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
      }
    });
    $$('[data-fav-count]').forEach(el => { el.textContent = set.size || ''; el.hidden = !set.size; });
  },
};

/* ── карточка рекомендации + полоса ── */
const RecUI = {
  card(x) {
    const d = x.d, q = Cart.qty(d.id), r = Extras.reviews.stats(d.id);
    return `<article class="rec-card" data-rec="${d.id}">
      <div class="rec-ph" style="--h:${dishHue(d)}" data-action="openDish" data-id="${d.id}">${d.photo ? `<img src="${esc(d.photo)}" alt="" loading="lazy" onerror="phFail(this)">` : ''}<span class="plate">${d.emoji}</span></div>
      <div class="rec-b"><span class="rec-why">${esc(x.why)}</span>
        <button type="button" class="rec-name" data-action="openDish" data-id="${d.id}">${esc(d.name)}</button>
        <div class="rec-f"><span class="price">${money(d.price)}</span>${r.count ? `<span class="rate-chip">★ ${r.avg.toFixed(1)}</span>` : ''}
          <button type="button" class="rec-add ${q ? 'has' : ''}" data-action="addToCart" data-id="${d.id}" aria-label="Добавить ${esc(d.name)} в корзину">${q ? `${icon('check', 15)}<span>×${q}</span>` : icon('plus', 18)}</button></div></div></article>`;
  },
  strip(title, sub, recs, cls = '') {
    if (!recs.length) return '';
    return `<section class="rec-strip ${cls}"><div class="sec-head"><h2>${title}</h2>${sub ? `<span>${sub}</span>` : ''}</div><div class="rec-row">${recs.map(x => this.card(x)).join('')}</div></section>`;
  },
  sync() {
    $$('.rec-card').forEach(c => {
      const q = Cart.qty(c.dataset.rec), b = $('.rec-add', c); if (!b) return;

      b.classList.toggle('has', !!q); b.innerHTML = q ? `${icon('check', 15)}<span>×${q}</span>` : icon('plus', 18);

  syncRate() {
    $$('.dish[data-dish]').forEach(c => { const s = $('.rate-slot', c); if (s) s.innerHTML = RecUI.rate(c.dataset.dish); });

  rate(id) { const r = Extras.reviews.stats(id); return r.count ? `<span class="rate-chip" title="${r.count} ${plural(r.count, ['отзыв', 'отзыва', 'отзывов'])}">★ ${r.avg.toFixed(1)} <small>(${r.count})</small></span>` : ''; },
};

/* ── промокоды ── */
const PromoUI = {
  strip() {
    const st = Extras.promo.state();
    return `<div class="promo-strip" id="promo-strip" role="group" aria-label="Промокоды">${Object.entries(PROMOS).map(([code, p]) => {
      const used = (st.used[code] || 0) >= p.limit, on = st.active === code;
      return `<button type="button" class="promo-tile ${on ? 'on' : ''} ${used ? 'used' : ''}" data-action="promoQuick" data-code="${code}" ${used ? 'disabled' : ''}>
        <span class="pt-ic">${icon(p.type === 'delivery' ? 'truck' : 'tag', 20)}</span>
        <span class="pt-tx"><b>${code}</b><small>${p.title}</small></span>
        <em>${used ? 'Использован' : on ? 'Применён ✓' : 'Применить'}</em></button>`;
    }).join('')}</div>`;
  },
  syncStrip() { const s = $('#promo-strip'); if (s) s.outerHTML = this.strip(); },
  box(scope) {
    const st = Extras.promo.state(), q = Extras.calc(0);
    if (st.active && PROMOS[st.active]) {
      const p = PROMOS[st.active];
      return `<div class="promo-box ok" data-scope="${scope}"><div class="promo-on"><span class="po-ic">${icon(p.type === 'delivery' ? 'truck' : 'tag', 18)}</span><div class="po-tx"><b>${st.active}</b><small>${q.promo ? (q.discount ? `Скидка ${money(q.discount)}` : p.title) : p.title}</small></div><button type="button" class="icon-btn sm" data-action="promoRemove" aria-label="Убрать промокод" title="Убрать промокод">${icon('x', 16)}</button></div>${q.promoNote ? `<div class="promo-msg warn" role="status">${esc(q.promoNote)}</div>` : ''}</div>`;
    }
    return `<div class="promo-box" data-scope="${scope}"><div class="promo-form"><span class="po-ic">${icon('tag', 18)}</span><input class="promo-input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="Промокод" aria-label="Промокод"><button type="button" class="btn btn-ghost btn-sm" data-action="promoApply">Применить</button></div><div class="promo-msg" role="alert" aria-live="polite"></div></div>`;

  },
};

      </div>
      ${pend.length ? `<section class="card bn-card"><h4>${icon('clock', 18)} Скоро начислим</h4><ul class="bn-hist">${pend.map(p => `<li class="pend"><span class="bl-ic">…</span><div><b>Заказ #${p.orderId}</b><small>Начислим после доставки</small></div><b class="bl-amt">+${fmtN(p.est)}</b></li>`).join('')}</ul></section>` : ''}

/* ── страница блюда ── */
const DishUI = {
  open(id) {
    const d = Catalog.get(id); if (!d) return;
    Modal.open({ id: 'dish', head: false, size: 'md', cls: 'dish-modal', html: this.html(d) });
  },
  reviewsHtml(d) {
    const r = Extras.reviews.stats(d.id), list = Extras.reviews.forDish(d.id).slice(0, 20), me = Sel.me();
    const elig = me ? Sel.customerOrders(me.id).filter(o => o.status === 5 && o.items.some(i => i.id === d.id)) : [];
    const mine = elig.length ? Extras.reviews.mine(elig[0].id, d.id) : null;
    const cta = elig.length
      ? `<button class="btn btn-primary btn-sm" data-action="openReview" data-id="${elig[0].id}" data-dish="${d.id}">${icon('star', 16)} ${mine ? 'Изменить отзыв' : 'Оставить отзыв'}</button>`
      : `<small class="dm-hint">Оставить отзыв можно после доставки заказа с этим блюдом.</small>`;
    return `<section class="dm-sec"><div class="dm-sec-h"><h4>Отзывы${r.count ? ` <em>${r.count}</em>` : ''}</h4>${cta}</div>
      ${r.count ? `<div class="rv-sum"><div class="rv-big"><b>${r.avg.toFixed(1)}</b>${stars(r.avg)}<small>${r.count} ${plural(r.count, ['отзыв', 'отзыва', 'отзывов'])}</small></div>
        <div class="rv-dist">${[5, 4, 3, 2, 1].map(n => `<div><span>${n}</span><i><b style="width:${Math.round(r.dist[n] / r.count * 100)}%"></b></i><small>${r.dist[n]}</small></div>`).join('')}</div></div>
        <ul class="rv-list">${list.map(x => `<li class="rv-item"><div class="rv-h">${avatar(x.author)}<div><b>${esc(x.author)}${me && x.userId === me.id ? ' <em class="rv-me">вы</em>' : ''}</b><small>${fmtDate(x.ts)}</small></div>${stars(x.rating, 'sm')}</div>${x.text ? `<p>${esc(x.text)}</p>` : ''}</li>`).join('')}</ul>`
      : `<div class="rv-empty"><span>💬</span><div><b>Пока нет отзывов</b><small>Станьте первым, кто оценит это блюдо.</small></div></div>`}
    </section>`;
  },
  html(d) {
    const q = Cart.qty(d.id), r = Extras.reviews.stats(d.id), warm = WARM_CATS.includes(d.cat);
    const recs = Extras.recs({ seeds: [d.id], limit: 4 });
    return `<div class="dm" data-dish="${d.id}">
      <div class="dm-photo" style="--h:${dishHue(d)}">${d.photo ? `<img src="${esc(d.photo)}" alt="${esc(d.name)}" onerror="phFail(this)">` : ''}<span class="plate" aria-hidden="true">${d.emoji}</span>${warm ? '<span class="steam" aria-hidden="true"><i></i><i></i><i></i></span>' : ''}${d.badge ? `<span class="dish-badge">${esc(d.badge)}</span>` : ''}${FavUI.btn(d.id, Extras.fav.has(d.id))}</div>
      <div class="dm-body">
        <div class="dm-top"><h2>${esc(d.name)}</h2><span class="dish-w">${esc(d.weight)}</span></div>
        <div class="dm-rate">${r.count ? `${stars(r.avg)}<b>${r.avg.toFixed(1)}</b><span>· ${r.count} ${plural(r.count, ['отзыв', 'отзыва', 'отзывов'])}</span>` : '<span class="muted">Пока без оценок</span>'}<span class="dm-cat">${(Catalog.cat(d.cat) || {}).emoji || ''} ${esc((Catalog.cat(d.cat) || {}).name || '')}</span></div>
        <p class="dm-desc">${esc(d.desc)}</p>
        <div class="dm-buy"><span class="price">${money(d.price)}</span><div class="dm-act" data-q="${q}">${CustomerView.dishAct(d.id, q)}</div></div>
        ${this.reviewsHtml(d)}
        ${recs.length ? `<section class="dm-sec"><div class="dm-sec-h"><h4>С этим заказывают</h4></div><div class="rec-row">${recs.map(x => RecUI.card(x)).join('')}</div></section>` : ''}
      </div></div>`;
  },
  sync() {
    const el = Modal.el('dish'); if (!el) return;
    const dm = $('.dm', el), act = $('.dm-act', el); if (!dm || !act) return;
    const q = Cart.qty(dm.dataset.dish);
    if (act.dataset.q !== String(q)) { act.innerHTML = CustomerView.dishAct(dm.dataset.dish, q); act.dataset.q = q; }
  },
  repaintReviews() {
    const el = Modal.el('dish'); if (!el) return;
    const dm = $('.dm', el), d = dm && Catalog.get(dm.dataset.dish); if (!d) return;
    const sec = $('.dm-sec', dm); if (!sec) return;
    const tmp = document.createElement('div'); tmp.innerHTML = this.reviewsHtml(d); sec.replaceWith(tmp.firstElementChild);
    const r = Extras.reviews.stats(d.id), rate = $('.dm-rate', dm);
    if (rate) rate.firstElementChild && (rate.innerHTML = `${r.count ? `${stars(r.avg)}<b>${r.avg.toFixed(1)}</b><span>· ${r.count} ${plural(r.count, ['отзыв', 'отзыва', 'отзывов'])}</span>` : '<span class="muted">Пока без оценок</span>'}<span class="dm-cat">${(Catalog.cat(d.cat) || {}).emoji || ''} ${esc((Catalog.cat(d.cat) || {}).name || '')}</span>`);
  },
};

/* ── отзывы: окно оценки ── */
const ReviewUI = {
  open(orderId, dishId) {
    const me = Sel.me(), o = Sel.order(orderId);
    if (!me || !o || o.customerId !== me.id) { Toast.error('Заказ не найден'); return; }
    if (o.status !== 5) { Toast.show('Оценить заказ можно после доставки', { icon: '⏳' }); return; }
    const items = o.items.filter(i => Catalog.get(i.id) && (!dishId || i.id === dishId));
    if (!items.length) { Toast.error('Этих блюд больше нет в меню'); return; }
    const row = i => {
      const d = Catalog.get(i.id), mine = Extras.reviews.mine(o.id, d.id), v = mine ? mine.rating : 0;
      return `<div class="rv-row" data-dish="${d.id}">
        <div class="rv-dish"><div class="ci-ph" style="--h:${dishHue(d)}">${d.photo ? `<img src="${esc(d.photo)}" alt="" onerror="phFail(this)">` : ''}<span>${d.emoji}</span></div><div><b>${esc(d.name)}</b><small>${i.qty} × · ${mine ? 'ваш отзыв можно изменить' : 'как вам блюдо?'}</small></div></div>
        <div class="star-input" role="radiogroup" aria-label="Оценка блюда ${esc(d.name)}">${[5, 4, 3, 2, 1].map(n => `<input type="radio" name="r_${d.id}" id="r_${d.id}_${n}" value="${n}" ${v === n ? 'checked' : ''}><label for="r_${d.id}_${n}" title="${['', 'Плохо', 'Так себе', 'Нормально', 'Хорошо', 'Отлично'][n]}"><span class="sr">${n}</span>★</label>`).join('')}</div>
        <textarea name="t_${d.id}" rows="2" maxlength="300" placeholder="Расскажите о блюде (необязательно)">${esc(mine ? mine.text : '')}</textarea>
        <div class="field-error rv-err" role="alert"></div></div>`;
    };
    Modal.open({ id: 'review', title: dishId ? 'Ваш отзыв' : `Оцените заказ #${o.id}`, sub: 'Отзыв увидят другие гости Moggs', size: 'md', cls: 'review-modal',
      html: `<form data-form="review" novalidate><input type="hidden" name="orderId" value="${o.id}"><div class="rv-rows">${items.map(row).join('')}</div><button class="btn btn-primary btn-lg btn-block" type="submit">Отправить</button></form>` });
  },
};

/* ── действия (сливаются с Actions в 08_app.js) ── */
const ExtrasActions = {
  toggleFav: t => {
    const id = t.dataset.id, card = t.closest('.dish');
    const onFavPage = CustomerView.route.name === 'favorites';
    const willRemove = Extras.fav.has(id);
    if (onFavPage && willRemove && card) card.classList.add('leaving');
    const on = Extras.fav.toggle(id);
    if (on) Toast.show(`«${Catalog.get(id).name}» в избранном`, { icon: '❤️', duration: 2600, action: { label: 'Открыть', fn: () => { Modal.closeAll(); Router.go('#/favorites'); } } });
    if (onFavPage && !on && card) setTimeout(() => CustomerView.paintFavs(), 320);
  },
  openDish: t => DishUI.open(t.dataset.id),
  openReview: t => ReviewUI.open(t.dataset.id, t.dataset.dish || null),
  /* промокоды */
  promoApply: t => {
    const box = t.closest('.promo-box'), input = $('.promo-input', box);
    const r = Extras.promo.apply(input.value);
    if (!r.ok) { PromoUI.showError(box, r.error); return; }
    const q = Extras.calc(0);
    Toast.show(q.promo ? (q.discount ? `Скидка ${money(q.discount)} применена` : 'Доставка бесплатна') : (q.promoNote || 'Промокод принят'), { icon: '🏷️', type: 'ok', title: `Промокод ${r.code}` });
  },
  promoRemove: () => { const c = Extras.promo.state().active; Extras.promo.remove(); Toast.show('Промокод снят', { icon: '🏷️', duration: 2200, title: c || '' }); },
  promoQuick: t => {
    const code = t.dataset.code;
    if (Extras.promo.state().active === code) { Extras.promo.remove(); Toast.show(`Промокод ${code} снят`, { icon: '🏷️', duration: 2200 }); return; }
    const r = Extras.promo.apply(code, { allowEmpty: true, ignoreMin: true });
    if (!r.ok) { Toast.error(r.error); return; }
    Toast.show(Cart.count() ? 'Скидка уже учтена в корзине' : 'Скидка появится в корзине', { icon: '🏷️', type: 'ok', title: `Промокод ${code} применён`, action: { label: 'Корзина', fn: () => CartUI.open() } });
  },
  bonusMax: () => { const q = Extras.calc(0); CheckoutUI.setBonus(q.bonusMax, true); },
  /* заказы */
  repeatOrder: t => {
    const r = Extras.repeat(t.dataset.id); if (!r) return;
    if (!r.added) { Toast.error('Блюда из этого заказа сейчас недоступны'); return; }
    Toast.show(`${r.added} ${plural(r.added, ['порция', 'порции', 'порций'])} из заказа #${r.order.id} — в корзине${r.skipped.length ? `. Недоступно: ${r.skipped.join(', ')}` : ''}`, { icon: '🔁', type: 'ok', title: 'Заказ повторён' });
    CartUI.open();
  },
  repeatLast: () => {
    const me = Sel.me(), last = Sel.customerOrders(me.id)[0]; if (!last) { Toast.show('Прошлых заказов пока нет', { icon: '🧾' }); return; }
    ExtrasActions.repeatOrder({ dataset: { id: last.id } });
  },
  addFavs: () => {
    const inCart = new Set(Cart.items.map(i => i.id)), list = Extras.fav.list().filter(id => !inCart.has(id));
    if (!list.length) { Toast.show(Extras.fav.list().length ? 'Все избранные блюда уже в корзине' : 'В избранном пока пусто', { icon: '❤️' }); return; }
    Cart.addMany(list.map(id => ({ id, qty: 1 })));
    Toast.ok(`Добавлено из избранного: ${list.length}`, 'Готово');
  },
};

/* Enter в поле промокода — применить, а не отправлять форму оформления */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.classList || !e.target.classList.contains('promo-input')) return;
  e.preventDefault(); const b = $('[data-action="promoApply"]', e.target.closest('.promo-box')); if (b) b.click();
});
/* ползунок баллов в оформлении заказа */
document.addEventListener('input', e => { if (e.target && e.target.id === 'co-bonus') CheckoutUI.setBonus(+e.target.value); });

/* Forms.review */
Object.assign(Forms, {
  review(form) {
    const v = formData(form), orderId = v.orderId; let n = 0, bad = false;
    $$('.rv-row', form).forEach(row => {
      const id = row.dataset.dish, rating = +(v['r_' + id] || 0), text = (v['t_' + id] || '').trim(), err = $('.rv-err', row);
      err.textContent = '';
      if (!rating) { if (text) { err.textContent = 'Выберите оценку — звёздочки выше'; bad = true; } return; }
      Extras.reviews.add({ orderId, dishId: id, rating, text }); n++;
    });
    if (bad) return;
    if (!n) { Toast.error('Поставьте оценку хотя бы одному блюду'); return; }
    Modal.close('review'); Toast.show(n === 1 ? 'Ваш отзыв опубликован' : `Опубликовано отзывов: ${n}`, { icon: '⭐', type: 'ok', title: 'Спасибо!' });
  },
});

/* ── реакции на события данных ── */
const ExtrasSync = {
  settle(silent) {
    const r = Extras.bonus.settle(); if (!r) return;
    if (silent) return;
    if (r.welcome) Toast.show(`+${pts(BONUS.welcome)} — приветственный бонус`, { icon: '🎁', title: 'Добро пожаловать в Moggs', action: { label: 'Бонусы', fn: () => Router.go('#/bonuses') }, duration: 6000 });
    else Toast.show(`+${pts(r.got)} за доставленный заказ`, { icon: '🎁', title: 'Бонусы начислены', action: { label: 'Посмотреть', fn: () => Router.go('#/bonuses') } });
  },
};
Bus.on('db', () => { if (App.view === 'customer') ExtrasSync.settle(); });
Bus.on('fav', () => { if (App.view !== 'customer') return; FavUI.sync(); if (CustomerView.route.name === 'favorites' && !$('.dish.leaving')) CustomerView.paintFavs(); });
Bus.on('promo', () => {
  if (App.view !== 'customer') return;
  PromoUI.syncStrip(); CustomerView.paintBadges();
  if (Modal.isOpen('cart')) CartUI.paint();
  if (Modal.isOpen('checkout')) CheckoutUI.paintSide();
});
Bus.on('bonus', () => {
  if (App.view !== 'customer') return;
  CustomerView.paintBadges();
  if (CustomerView.route.name === 'bonuses') CustomerView.paintBonuses(true);
});
Bus.on('reviews', () => {
  if (App.view !== 'customer') return;
  RecUI.syncRate(); DishUI.repaintReviews();
  if (CustomerView.route.name === 'orders') CustomerView.paintOrders();
  if (CustomerView.route.name === 'track') CustomerView.paintTrack();
});
</script>
<script>

/* ════════════════════════════════════════════════════════════════
   6. COURIER — панель курьера
   ════════════════════════════════════════════════════════════════ */
const CourierView = {
  tab: 'orders', chat: null,

  render(seg) {
    this.tab = ['history', 'chat'].includes(seg[1]) ? seg[1] : 'orders';
    Live.remove('k-chat'); this.chat = null;
    const me = Sel.me();
    $('#app').innerHTML = `
    <div class="kur">
      <header class="k-head"><div class="k-head-in">
        <a class="brand" href="#/courier" aria-label="Moggs Курьер">${logo(34)}<span>Moggs <em>Курьер</em></span></a>
        <div class="k-head-r">
          <label class="switch" title="Выйти на линию / уйти с линии"><input type="checkbox" id="online-toggle" data-change="toggleOnline" ${me.online ? 'checked' : ''} aria-label="Статус онлайн"><span class="sw"></span><span class="sw-l" id="online-label"></span></label>
          <button class="btn btn-ghost btn-sm" data-action="logout" aria-label="Выйти">${icon('logout', 18)}<span class="hide-m">Выйти</span></button>
        </div>
      </div></header>
      <div class="k-wrap">
        <aside class="k-side" id="k-side"></aside>
        <section class="k-main">
          <nav class="seg k-tabs" id="k-tabs" aria-label="Разделы"></nav>
          <div id="k-content"></div>
        </section>
      </div>
    </div>`;
    this.paintSide(); this.paintTabs(); this.paintContent();
  },

  refresh() {
    this.paintSide(); this.paintTabs();
    if (this.tab !== 'chat') this.paintContent();
  },

  paintSide() {
    const me = Sel.me(), side = $('#k-side'); if (!side) return;
    const st = Sel.courierState(me), tr = transportOf(me.transport), hist = Sel.courierHistory(me.id);
    const tg = $('#online-toggle'); if (tg) tg.checked = !!me.online;
    const lb = $('#online-label'); if (lb) lb.textContent = st === 'offline' ? 'Не в сети' : st === 'busy' ? 'Занят' : 'Онлайн';
    side.innerHTML = `
    <div class="card k-profile">
      <div class="kp-top">${avatar(me.name, 'xl')}<div><h3>${esc(me.name)}</h3><button class="tag-chip" data-action="copyTag" data-tag="${esc(me.tag)}" title="Скопировать тег">${esc(me.tag)} ${icon('copy', 14)}</button></div></div>
      <div class="kp-status">${courierPill(st)}</div>
      <dl class="kp-meta">
        <div><dt>Транспорт</dt><dd>${tr.emoji} ${tr.name}</dd></div>
        <div><dt>Время работы</dt><dd>${esc(me.workTime)}</dd></div>
        <div><dt>Телефон</dt><dd>${fmtPhone(me.phone)}</dd></div>
        <div><dt>Возраст</dt><dd>${me.age} лет</dd></div>
      </dl>
      <div class="kp-stats"><div><b>${hist.length}</b><small>доставок</small></div><div><b>${money(hist.length * CONFIG.courierFee)}</b><small>заработано</small></div><div><b>4.9</b><small>рейтинг</small></div></div>
      <a class="btn btn-ghost btn-block" href="#/courier/chat">${icon('chat', 18)} Чат с администратором</a>
    </div>`;
  },

  paintTabs() {
    const me = Sel.me(), box = $('#k-tabs'); if (!box) return;
    const av = me.online ? Sel.available().length : 0, un = Sel.chat(me.id).courierUnread;
    box.innerHTML = `
      <a class="${this.tab === 'orders' ? 'on' : ''}" href="#/courier">Заказы${av ? ` <span class="count">${av}</span>` : ''}</a>
      <a class="${this.tab === 'history' ? 'on' : ''}" href="#/courier/history">История</a>
      <a class="${this.tab === 'chat' ? 'on' : ''}" href="#/courier/chat">Чат${un ? ` <span class="count">${un}</span>` : ''}</a>`;
  },

  paintContent() {
    const me = Sel.me(), host = $('#k-content'); if (!host) return;
    if (this.tab === 'orders') host.innerHTML = this.ordersHtml(me);
    else if (this.tab === 'history') host.innerHTML = this.historyHtml(me);
    else if (!this.chat) this.mountChat(me, host);
  },

  orderCard(o, mode, hasCurrent) {
    const cust = Sel.user(o.customerId), a = o.address;
    const steps = ['Принят', 'Забрал', 'В пути', 'Доставлен'];
    const idx = o.status <= 2 ? 0 : o.status - 2;
    let actions = '';
    if (mode === 'available') {
      actions = `<button class="btn btn-primary btn-lg" data-action="acceptOrder" data-id="${o.id}" ${hasCurrent ? 'disabled' : ''}>Принять заказ</button>${hasCurrent ? '<small class="hint">Сначала завершите текущий заказ</small>' : ''}`;
    } else if (o.status === 2) {
      actions = `<button class="btn btn-primary btn-lg" data-action="courierStep" data-id="${o.id}">Начать доставку</button>`;
    } else if (o.status === 3) {
      actions = `<button class="btn btn-primary btn-lg" disabled><span class="spin"></span> Забираю заказ…</button>`;
    } else if (o.status === 4) {
      actions = `<button class="btn btn-ok btn-lg" data-action="courierStep" data-id="${o.id}">Заказ доставлен</button>`;
    }
    return `
    <article class="k-order ${mode}">
      <div class="k-order-head"><div class="ko-id"><b>#${o.id}</b>${mode === 'current' ? statusPill(o.status) : '<span class="pill p-warn">Ожидает курьера</span>'}</div><div class="ko-meta"><span>${icon('pin', 14)} ${o.distance} км</span><span>${icon('clock', 14)} ≈ ${Math.max(8, Math.round(6 + o.distance * 4))} мин</span></div></div>
      ${mode === 'current' ? `<ol class="k-steps">${steps.map((s, i) => `<li class="${i < idx ? 'done' : ''} ${i === idx ? 'cur' : ''}"><i></i>${s}</li>`).join('')}</ol>` : ''}
      <div class="k-grid">
        <div><small>Адрес доставки</small><b>${esc(addrLine(a))}</b><span>${esc(addrDetails(a))}</span></div>
        <div><small>Заказчик</small><b>${esc(cust ? cust.name : 'Клиент')}</b><span>${cust ? maskPhone(cust.phone) : ''}</span></div>
      </div>
      <ul class="k-items">${o.items.map(i => `<li><span>${i.emoji} ${i.qty} × ${esc(i.name)}</span><b>${money(i.price * i.qty)}</b></li>`).join('')}</ul>
      ${o.comment ? `<div class="k-comment">💬 ${esc(o.comment)}</div>` : ''}
      <div class="k-foot">
        <div class="k-sum"><small>Сумма заказа</small><b>${money(o.total)}</b><span>${o.payment === 'card' ? '💳 Оплачено картой' : '💵 Получить наличными'}</span></div>
        <div class="k-actions">${actions}</div>
      </div>
      ${mode === 'current' ? `<div class="k-links"><button class="link-btn" data-action="callCustomer">${icon('phone', 16)} Позвонить клиенту</button><a class="link-btn" href="#/courier/chat">${icon('chat', 16)} Написать администратору</a></div>` : ''}
    </article>`;
  },

  ordersHtml(me) {
    const cur = Sel.courierCurrent(me.id);
    let h = '';
    if (cur) h += `<h3 class="list-h">Текущий заказ</h3>${this.orderCard(cur, 'current')}`;
    if (!me.online) {
      h += cur ? '' : `<div class="empty"><div class="empty-ic">😴</div><h3>Вы не в сети</h3><p>Выйдите на линию, чтобы видеть доступные заказы.</p><button class="btn btn-primary" data-action="goOnline">Выйти на линию</button></div>`;
    } else {
      const av = Sel.available();
      h += `<h3 class="list-h">Доступные заказы <span class="count">${av.length}</span></h3>`;
      h += av.length ? av.map(o => this.orderCard(o, 'available', !!cur)).join('')
        : `<div class="empty compact"><div class="empty-ic">⏳</div><h3>Пока нет свободных заказов</h3><p>Новые заказы появятся здесь автоматически — мы сообщим уведомлением.</p></div>`;
    }
    return h;
  },

  historyHtml(me) {
    const list = Sel.courierHistory(me.id);
    if (!list.length) return `<div class="empty"><div class="empty-ic">📭</div><h3>История пуста</h3><p>Завершённые доставки появятся здесь.</p></div>`;
    return `<h3 class="list-h">История доставок <span class="count">${list.length}</span></h3><div class="hist">${list.map(o => `
      <article class="hist-row"><div class="hr-l"><b>#${o.id}</b><small>${fmtDate(o.deliveredAt || o.createdAt)}</small></div>
      <div class="hr-m"><span>${esc(addrLine(o.address))}</span><small>${o.items.reduce((s, i) => s + i.qty, 0)} поз. · ${money(o.total)} · ${o.distance} км</small></div>
      <div class="hr-r"><b>+${money(CONFIG.courierFee)}</b><span class="pill p-ok">Доставлено</span></div></article>`).join('')}</div>`;
  },

  mountChat(me, host) {
    const opened = Date.now();
    host.innerHTML = `<div class="card chat-card"><div class="chat-head"><div class="ch-users"><span class="ch-u">${avatar('А', 'sm')}Администратор</span><span class="ch-arr">↔</span><span class="ch-u">${avatar(me.name, 'sm')}${esc(me.name)}</span></div><small>Ответим в течение пары минут</small></div><div id="k-chat-host"></div></div>`;
    this.chat = Chat.mount($('#k-chat-host', host), {
      me: 'courier', placeholder: 'Сообщение администратору…',
      get: () => {
        const c = Sel.chat(me.id);
        const msgs = c.messages.length ? c.messages : [{ id: 'greet', from: 'admin', text: 'Здравствуйте! Пишите, если возникнут вопросы по заказам или маршруту.', ts: opened }];
        return { messages: msgs, quick: c.messages.length ? [] : ['Не могу найти адрес', 'Клиент не отвечает', 'Проблема с заказом'] };
      },
      send: t => Api.chat.send(me.id, 'courier', t),
      who: (m, side) => side === 'me' ? '' : 'Администратор',
    });
    Live.add('k-chat', () => { if (Sel.chat(me.id).courierUnread) Api.chat.markRead(me.id, 'courier'); if (this.chat) this.chat.paint(); });
    if (Sel.chat(me.id).courierUnread) Api.chat.markRead(me.id, 'courier');
  },
};
</script>
<script>

/* ════════════════════════════════════════════════════════════════
   7. ADMIN — панель администратора
   ════════════════════════════════════════════════════════════════ */
const ADMIN_NAV = [['overview', '📊', 'Обзор'], ['orders', '🧾', 'Заказы'], ['users', '👥', 'Пользователи'], ['couriers', '🛵', 'Курьеры'], ['support', '💬', 'Поддержка'], ['deliveries', '📦', 'Доставки']];
const QUICK_REPLIES = ['Здравствуйте! Уже разбираемся 🙌', 'Уточните, пожалуйста, номер заказа', 'Курьер уже в пути, будет в течение 10 минут', 'Приносим извинения за неудобства. Оформим компенсацию.'];
const ORDER_FILTERS = [['all', 'Все'], ['active', 'Активные'], ['waiting', 'Ждут курьера'], ['done', 'Доставленные']];

const AdminView = {
  supChat: null, supChatFor: null,

  render(seg) {
    const sec = ADMIN_NAV.some(n => n[0] === seg[1]) ? seg[1] : 'overview';
    App.state.adminSection = sec;
    Live.remove('a-sup'); this.supChat = null; this.supChatFor = null;
    const me = Sel.me();
    $('#app').innerHTML = `
    <div class="adm">
      <aside class="a-side">
        <a class="a-brand" href="#/admin">${logo(34)}<div><b>Moggs</b><small>Админ-панель</small></div></a>
        <nav class="a-nav" id="a-nav" aria-label="Разделы"></nav>
        <div class="a-me"><div class="a-me-info">${avatar(me.name, 'sm')}<div><b>${esc(me.name)}</b><span class="mono">${esc(me.tag)}</span></div></div><button class="icon-btn" data-action="logout" aria-label="Выйти" title="Выйти">${icon('logout')}</button></div>
      </aside>
      <div class="a-main">
        <header class="a-top"><h1 id="a-title"></h1><span class="live-dot">Онлайн</span></header>
        <div id="a-content"></div>
      </div>
    </div>`;
    this.paintNav(); this.paint(true);
  },

  refresh() {
    this.paintNav();
    if (App.state.adminSection === 'support') this.paintSupport(false); else this.paint(false);
  },

  paintNav() {
    const nav = $('#a-nav'); if (!nav) return;
    const badge = {
      orders: Db.data.orders.filter(o => o.status < 5).length,
      support: Db.data.tickets.filter(t => t.status !== 'closed' && (t.status === 'new' || t.adminUnread)).length,
      couriers: Object.values(Db.data.courierChats).reduce((s, c) => s + (c.adminUnread || 0), 0),
    };
    nav.innerHTML = ADMIN_NAV.map(([id, em, name]) => `<a class="a-link ${App.state.adminSection === id ? 'on' : ''}" href="#/admin/${id}"><span class="a-em">${em}</span><span>${name}</span>${badge[id] ? `<i class="a-badge ${id === 'support' || id === 'couriers' ? 'hot' : ''}">${badge[id]}</i>` : ''}</a>`).join('');
    const t = ADMIN_NAV.find(n => n[0] === App.state.adminSection); const h = $('#a-title'); if (h && t) h.textContent = t[2];
  },

  paint(full) {
    const sec = App.state.adminSection, host = $('#a-content'); if (!host) return;
    if (sec === 'support') return this.paintSupport(true);
    host.innerHTML = `<div class="a-page">${this[sec]()}</div>`;
  },

  /* ── обзор ── */
  overview() {
    const os = Db.data.orders, t0 = new Date().setHours(0, 0, 0, 0), today = os.filter(o => o.createdAt >= t0);
    const cs = Sel.couriers(), online = cs.filter(c => c.online).length, active = os.filter(o => o.status < 5);
    const attn = Db.data.tickets.filter(t => t.status !== 'closed' && (t.status === 'new' || t.adminUnread)).sort((a, b) => b.updatedAt - a.updatedAt);
    const kpi = (ic, l, v, tone = '') => `<div class="kpi ${tone}"><span class="kpi-ic">${ic}</span><div><small>${l}</small><b>${v}</b></div></div>`;
    return `
    <div class="kpis">
      ${kpi('🧾', 'Заказов сегодня', today.length)}${kpi('💰', 'Выручка сегодня', money(today.reduce((s, o) => s + o.total, 0)))}
      ${kpi('📦', 'Активных заказов', active.length)}${kpi('🛵', 'Курьеров онлайн', `${online} / ${cs.length}`)}
      ${kpi('💬', 'Новых обращений', Sel.newTickets().length, Sel.newTickets().length ? 'hot' : '')}
    </div>
    <div class="a-cols">
      <section class="a-card">
        <div class="a-card-h"><h3>Требуют внимания</h3><a class="link-btn" href="#/admin/support">Все обращения</a></div>
        ${attn.length ? `<div class="nt-list">${attn.slice(0, 4).map(t => this.newTicketCard(t)).join('')}</div>` : `<div class="empty compact"><div class="empty-ic">🎉</div><h3>Всё обработано</h3><p>Новых обращений нет.</p></div>`}
      </section>
      <section class="a-card">
        <div class="a-card-h"><h3>Активные доставки</h3><a class="link-btn" href="#/admin/deliveries">Все доставки</a></div>
        ${active.length ? `<ul class="mini-list">${active.slice(0, 5).map(o => { const c = o.courierId ? Sel.user(o.courierId) : null; return `<li data-action="openOrder" data-id="${o.id}"><div><b>#${o.id}</b><small>${esc(addrLine(o.address))}</small></div><div class="ml-r">${statusPill(o.status)}<small>${c ? esc(c.name) : 'без курьера'}</small></div></li>`; }).join('')}</ul>` : `<div class="empty compact"><p>Сейчас нет активных заказов.</p></div>`}
      </section>
    </div>
    <section class="a-card">
      <div class="a-card-h"><h3>Последние заказы</h3><a class="link-btn" href="#/admin/orders">Все заказы</a></div>
      ${this.ordersTable(Sel.orders().slice(0, 5))}
    </section>`;
  },
  newTicketCard(t) {
    const last = t.messages.filter(m => m.from === 'user').slice(-1)[0] || t.messages[t.messages.length - 1];
    return `<article class="new-ticket ${t.status === 'new' ? 'is-new' : ''}">
      <div class="nt-head"><span class="nt-badge">${t.status === 'new' ? 'Новое обращение' : 'Новое сообщение'}</span><small>${fmtDate(t.updatedAt)}</small></div>
      <div class="nt-meta"><div><small>Пользователь</small><b class="mono">${esc(t.userTag)}</b> <span>${esc(t.userName)}</span></div><div><small>ID</small><b class="mono">#${t.id}</b></div></div>
      <blockquote>«${esc(last ? last.text : '')}»</blockquote>
      <div class="nt-btns"><button class="btn btn-primary btn-sm" data-action="adminReply" data-id="${t.id}">Ответить</button><button class="btn btn-ghost btn-sm" data-action="adminCloseTicket" data-id="${t.id}">Закрыть</button></div>
    </article>`;
  },

  /* ── заказы ── */
  ordersTable(list) {
    if (!list.length) return `<div class="empty compact"><p>Заказов нет.</p></div>`;
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Заказ</th><th>Клиент</th><th>Состав</th><th>Сумма</th><th>Статус</th><th>Курьер</th><th>Время</th></tr></thead><tbody>
      ${list.map(o => { const cu = Sel.user(o.customerId), c = o.courierId ? Sel.user(o.courierId) : null; return `<tr class="clickable" data-action="openOrder" data-id="${o.id}">
        <td data-label="Заказ"><b>#${o.id}</b></td><td data-label="Клиент">${esc(cu ? cu.name : '—')}<small class="mono">${esc(cu ? cu.tag : '')}</small></td>
        <td data-label="Состав">${o.items.reduce((s, i) => s + i.qty, 0)} поз.</td><td data-label="Сумма"><b>${money(o.total)}</b></td>
        <td data-label="Статус">${statusPill(o.status)}</td><td data-label="Курьер">${c ? esc(c.name) : '<span class="muted">—</span>'}</td><td data-label="Время">${fmtDate(o.createdAt)}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  },
  orders() {
    const f = App.state.adminOrderFilter, all = Sel.orders();
    const list = all.filter(o => f === 'all' || (f === 'active' && o.status < 5) || (f === 'waiting' && o.status === 2 && !o.courierId) || (f === 'done' && o.status === 5));
    return `<div class="a-toolbar"><div class="chips">${ORDER_FILTERS.map(([id, n]) => `<button class="chip ${f === id ? 'on' : ''}" data-action="orderFilter" data-f="${id}">${n}</button>`).join('')}</div><span class="muted">${list.length} из ${all.length}</span></div>
      <section class="a-card flush">${this.ordersTable(list)}</section>`;
  },

  /* ── пользователи ── */
  users() {
    const f = App.state.adminUserFilter, all = Sel.users();
    const list = all.filter(u => f === 'all' || u.role === f);
    const flt = [['all', 'Все'], ['customer', 'Заказчики'], ['courier', 'Курьеры'], ['admin', 'Администраторы']];
    return `<div class="a-toolbar"><div class="chips">${flt.map(([id, n]) => `<button class="chip ${f === id ? 'on' : ''}" data-action="userFilter" data-f="${id}">${n}${id !== 'all' ? ` <em>${all.filter(u => u.role === id).length}</em>` : ''}</button>`).join('')}</div><span class="muted">${list.length} пользователей</span></div>
      <section class="a-card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Тег</th><th>Имя</th><th>Роль</th><th>Телефон</th><th>Регистрация</th><th>Активность</th></tr></thead><tbody>
      ${list.map(u => `<tr><td data-label="Тег"><b class="mono">${esc(u.tag)}</b></td><td data-label="Имя"><span class="u-name">${avatar(u.name, 'sm')}${esc(u.name)}</span></td>
        <td data-label="Роль"><span class="pill p-role-${u.role}">${roleLabel(u.role)}</span></td><td data-label="Телефон">${u.phone ? fmtPhone(u.phone) : '<span class="muted">—</span>'}</td>
        <td data-label="Регистрация">${fmtDate(u.createdAt)}</td>
        <td data-label="Активность">${u.role === 'customer' ? Sel.customerOrders(u.id).length + ' заказов' : u.role === 'courier' ? Sel.courierHistory(u.id).length + ' доставок' : '—'}</td></tr>`).join('')}
      </tbody></table></div></section>`;
  },

  /* ── курьеры ── */
  couriers() {
    const cs = Sel.couriers();
    return `<div class="a-toolbar"><span class="muted">Всего курьеров: ${cs.length} · онлайн: ${cs.filter(c => c.online).length}</span></div>
    <div class="cour-grid">${cs.map(c => {
      const st = Sel.courierState(c), cur = Sel.courierCurrent(c.id), tr = transportOf(c.transport), un = Sel.chat(c.id).adminUnread;
      return `<article class="cour-card">
        <div class="cc-top">${avatar(c.name, 'lg')}<div class="cc-id"><h4>${esc(c.name)}</h4><span class="mono">${esc(c.tag)}</span></div>${courierPill(st)}</div>
        <dl class="cc-dl"><div><dt>Транспорт</dt><dd>${tr.emoji} ${tr.name}</dd></div><div><dt>Рабочее время</dt><dd>${esc(c.workTime)}</dd></div>
        <div><dt>Текущий заказ</dt><dd>${cur ? `<a class="link-btn" data-action="openOrder" data-id="${cur.id}">#${cur.id}</a>` : '<span class="muted">—</span>'}</dd></div>
        <div><dt>Телефон</dt><dd>${fmtPhone(c.phone)}</dd></div></dl>
        <button class="btn btn-primary btn-block" data-action="contactCourier" data-id="${c.id}">${icon('chat', 18)} Связаться с курьером${un ? ` <i class="a-badge hot">${un}</i>` : ''}</button>
      </article>`;
    }).join('')}</div>`;
  },

  /* ── доставки ── */
  deliveries() {
    const os = Sel.orders(), wait = os.filter(o => o.status === 2 && !o.courierId), act = os.filter(o => o.courierId && o.status >= 2 && o.status < 5);
    const doneToday = os.filter(o => o.status === 5 && o.deliveredAt >= new Date().setHours(0, 0, 0, 0)).length;
    const cs = Sel.couriers();
    const card = o => { const c = o.courierId ? Sel.user(o.courierId) : null;
      return `<article class="deliv">
        <div class="dv-top"><div><b>#${o.id}</b><small>${esc(addrLine(o.address))}</small></div>${statusPill(o.status)}</div>
        <div class="bar sm"><i style="width:${Math.round((o.status + 1) / 6 * 100)}%"></i></div>
        <div class="dv-mid"><span>${c ? `${transportOf(c.transport).emoji} ${esc(c.name)} <em class="mono">${esc(c.tag)}</em>` : 'Курьер не назначен'}</span><span>≈ ${Sel.eta(o)} мин · ${o.distance} км</span></div>
        <div class="dv-btns">
          ${c ? `<button class="btn btn-ghost btn-sm" data-action="contactCourier" data-id="${c.id}">${icon('chat', 16)} Связаться с курьером</button>` :
            `<select class="sel sm" data-change="assignCourier" data-id="${o.id}" aria-label="Назначить курьера"><option value="">Назначить курьера…</option>${cs.map(k => `<option value="${k.id}">${esc(k.name)} · ${COURIER_STATE[Sel.courierState(k)][1]}</option>`).join('')}</select>`}
          <button class="btn btn-soft btn-sm" data-action="adminNext" data-id="${o.id}">Следующий статус →</button>
        </div></article>`; };
    return `<div class="kpis three"><div class="kpi"><span class="kpi-ic">⏳</span><div><small>Ждут курьера</small><b>${wait.length}</b></div></div><div class="kpi"><span class="kpi-ic">🛵</span><div><small>В доставке</small><b>${act.length}</b></div></div><div class="kpi"><span class="kpi-ic">✅</span><div><small>Доставлено сегодня</small><b>${doneToday}</b></div></div></div>
      <h3 class="list-h">Ожидают курьера <span class="count">${wait.length}</span></h3>
      ${wait.length ? `<div class="deliv-grid">${wait.map(card).join('')}</div>` : `<div class="empty compact"><p>Все готовые заказы уже назначены.</p></div>`}
      <h3 class="list-h">В пути <span class="count">${act.length}</span></h3>
      ${act.length ? `<div class="deliv-grid">${act.map(card).join('')}</div>` : `<div class="empty compact"><p>Активных доставок нет.</p></div>`}`;
  },

  /* ── поддержка (двухпанельный чат) ── */
  paintSupport(full) {
    const host = $('#a-content'); if (!host) return;
    if (full || !$('#sup')) {
      host.innerHTML = `<div class="sup" id="sup"><section class="sup-list"><div class="seg sm" id="sup-filters"></div><div id="sup-items" class="tk-list"></div></section><section class="sup-thread"><div id="sup-head"></div><div id="sup-chat"></div></section></div>`;
      this.supChat = null; this.supChatFor = null;
    }
    this.paintTicketList(); this.paintThread();
  },
  paintTicketList() {
    const f = App.state.adminTicketFilter, all = Sel.tickets(), sel = App.state.adminTicketId;
    const cnt = { all: all.length, new: all.filter(t => t.status === 'new').length, in_progress: all.filter(t => t.status === 'in_progress').length, closed: all.filter(t => t.status === 'closed').length };
    const fl = [['all', 'Все'], ['new', 'Новые'], ['in_progress', 'В работе'], ['closed', 'Закрытые']];
    $('#sup-filters').innerHTML = fl.map(([id, n]) => `<button class="${f === id ? 'on' : ''}" data-action="ticketFilter" data-f="${id}">${n} <em>${cnt[id]}</em></button>`).join('');
    const list = all.filter(t => f === 'all' || t.status === f);
    $('#sup-items').innerHTML = list.length ? list.map(t => {
      const last = t.messages[t.messages.length - 1];
      return `<button class="tk ${sel === t.id ? 'sel' : ''} ${t.adminUnread ? 'unread' : ''}" data-action="openTicket" data-id="${t.id}">
        <div class="tk-top"><span class="mono tk-id">#${t.id}</span>${ticketPill(t.status)}<time>${fmtTime(t.updatedAt)}</time></div>
        <div class="tk-user"><b>${esc(t.userName)}</b> <span class="mono">${esc(t.userTag)}</span></div>
        <div class="tk-last">${last && last.from === 'admin' ? 'Вы: ' : ''}${esc(last ? last.text : '')}</div>
        ${t.adminUnread ? `<i class="tk-dot">${t.adminUnread}</i>` : ''}</button>`;
    }).join('') : `<div class="empty compact"><div class="empty-ic">📭</div><p>Обращений в этой категории нет.</p></div>`;
  },
  paintThread() {
    const id = App.state.adminTicketId, t = id ? Sel.ticket(id) : null, sup = $('#sup');
    if (!sup) return;
    sup.classList.toggle('has-thread', !!t);
    const head = $('#sup-head'), host = $('#sup-chat');
    if (!t) {
      head.innerHTML = ''; host.innerHTML = `<div class="empty"><div class="empty-ic">💬</div><h3>Выберите обращение</h3><p>Откройте обращение слева, чтобы прочитать сообщения и ответить пользователю.</p></div>`;
      this.supChat = null; this.supChatFor = null; Live.remove('a-sup'); return;
    }
    head.innerHTML = `<div class="th-head">
      <button class="icon-btn th-back" data-action="closeThread" aria-label="Назад к списку">${icon('back')}</button>
      <div class="th-info"><div class="th-title"><b class="mono">#${t.id}</b>${ticketPill(t.status)}</div>
        <div class="th-user">${avatar(t.userName, 'sm')}<span><b>${esc(t.userName)}</b> <span class="mono">${esc(t.userTag)}</span> · ${roleLabel(t.userRole)}</span></div></div>
      <div class="th-btns">${t.status === 'closed' ? `<button class="btn btn-soft btn-sm" data-action="adminReopen" data-id="${t.id}">Переоткрыть</button>` : `<button class="btn btn-danger btn-sm" data-action="adminCloseTicket" data-id="${t.id}">${icon('check', 16)} Закрыть обращение</button>`}</div></div>`;
    if (this.supChatFor !== t.id) {
      host.innerHTML = '';
      this.supChat = Chat.mount(host, {
        me: 'admin', fill: true, placeholder: 'Ответ пользователю…',
        get: () => { const tk = Sel.ticket(t.id); const closed = tk.status === 'closed'; return { messages: tk.messages, disabled: closed, disabledPlaceholder: 'Обращение закрыто', note: closed ? 'Обращение закрыто. Нажмите «Переоткрыть», чтобы продолжить переписку.' : '', quick: closed ? [] : QUICK_REPLIES }; },
        send: text => Api.support.reply(t.id, text, Sel.me()),
        who: (m, side) => side === 'me' ? '' : `${m.name || t.userName} ${m.tag || ''}`.trim(),
      });
      this.supChatFor = t.id;
      Live.add('a-sup', () => { if (this.supChat) this.supChat.paint(); });
      this.supChat.focus();
    } else this.supChat.paint();
    if (t.adminUnread) Api.support.markRead(t.id, 'admin');
  },
  openTicketFromAnywhere(id) {
    App.state.adminTicketId = id;
    if (App.view === 'admin' && App.state.adminSection === 'support') this.paintSupport(false); else Router.go('#/admin/support');
  },
};

/* ── окна администратора ── */
const AdminUI = {
  openOrder(id) {
    const o = Sel.order(id); if (!o) return;
    const cu = Sel.user(o.customerId), cs = Sel.couriers();
    Modal.open({
      id: 'order', title: `Заказ #${o.id}`, sub: statusPill(o.status), size: 'lg', html: `
      <div class="ao">
        <div class="ao-grid">
          <div><small>Клиент</small><b>${esc(cu ? cu.name : '—')}</b><span class="mono">${esc(cu ? cu.tag : '')}</span></div>
          <div><small>Телефон</small><b>${cu ? fmtPhone(cu.phone) : '—'}</b></div>
          <div><small>Адрес</small><b>${esc(addrLine(o.address))}</b><span>${esc(addrDetails(o.address))}</span></div>
          <div><small>Оплата · создан</small><b>${o.payment === 'card' ? '💳 Картой' : '💵 Наличными'}</b><span>${fmtDate(o.createdAt)} · ${o.distance} км</span></div>
        </div>
        <ul class="mini-items">${o.items.map(i => `<li><span>${i.emoji} ${i.qty} × ${esc(i.name)}</span><b>${money(i.price * i.qty)}</b></li>`).join('')}
          ${o.discount ? `<li class="tot"><span>Промокод ${esc(o.promo || '')}</span><b>−${money(o.discount)}</b></li>` : ''}${o.bonusUsed ? `<li class="tot"><span>Оплачено баллами</span><b>−${money(o.bonusUsed)}</b></li>` : ''}<li class="tot"><span>Доставка</span><b>${o.fee ? money(o.fee) : 'Бесплатно'}</b></li><li class="tot"><span>Итого</span><b>${money(o.total)}</b></li></ul>
        ${o.comment ? `<div class="k-comment">💬 ${esc(o.comment)}</div>` : ''}
        <form data-form="adminOrder" data-id="${o.id}" novalidate>
          <h4 class="pf-h">Управление заказом</h4>
          <div class="grid2">
            <div class="field" data-field="status"><label for="ao-status">Статус</label><select id="ao-status" name="status" class="sel">${ORDER_STATUSES.map((s, i) => `<option value="${i}" ${i === o.status ? 'selected' : ''}>${i + 1}. ${s.label}</option>`).join('')}</select><div class="field-error"></div></div>
            <div class="field" data-field="courierId"><label for="ao-courier">Курьер</label><select id="ao-courier" name="courierId" class="sel"><option value="">— не назначен —</option>${cs.map(k => `<option value="${k.id}" ${k.id === o.courierId ? 'selected' : ''}>${esc(k.name)} · ${COURIER_STATE[Sel.courierState(k)][1]}</option>`).join('')}</select><div class="field-error"></div></div>
          </div>
          <div class="btn-row"><button class="btn btn-primary" type="submit">Сохранить</button>${o.courierId ? `<button class="btn btn-ghost" type="button" data-action="contactCourier" data-id="${o.courierId}">${icon('chat', 18)} Связаться с курьером</button>` : ''}</div>
        </form>
      </div>`,
    });
  },
  contactCourier(cid) {
    const c = Sel.user(cid); if (!c) return;
    const st = Sel.courierState(c);
    Modal.open({
      id: 'courier-chat', title: 'Связаться с курьером', sub: `${esc(c.name)} · <span class="mono">${esc(c.tag)}</span> · ${courierPill(st)}`, size: 'chat',
      html: `<div class="chat-users"><span>Администратор</span><b>↔</b><span>Курьер ${esc(c.name)}</span></div><div class="chat-host"></div>`,
      onMount: el => {
        const chat = Chat.mount($('.chat-host', el), {
          me: 'admin', placeholder: `Сообщение курьеру ${c.name}…`,
          get: () => { const ch = Sel.chat(cid); return { messages: ch.messages, note: ch.messages.length ? '' : 'Сообщений пока нет — напишите курьеру', quick: ['Как продвигается заказ?', 'Позвоните клиенту, пожалуйста', 'Не забудьте выйти на линию'] }; },
          send: t => Api.chat.send(cid, 'admin', t),
          who: (m, side) => side === 'me' ? '' : c.name,
        });
        Live.add('courier-chat', () => { if (Sel.chat(cid).adminUnread) Api.chat.markRead(cid, 'admin'); chat.paint(); });
        if (Sel.chat(cid).adminUnread) Api.chat.markRead(cid, 'admin');
        chat.focus();
      },
      onClose: () => Live.remove('courier-chat'),
    });
  },
};

Object.assign(Forms, {
  async adminOrder(form) {
    const v = formData(form), id = form.dataset.id;
    if (+v.status >= 3 && !v.courierId) { showErrors(form, { courierId: 'Для этого статуса нужен курьер' }); return; }
    const btn = $('[type=submit]', form); setBusy(btn, true, true);
    await Api.orders.adminUpdate(id, { status: v.status, courierId: v.courierId });
    setBusy(btn, false); Modal.close('order'); Toast.ok(`Заказ #${id} обновлён`, 'Сохранено');
  },
});
</script>
<script>

/* ════════════════════════════════════════════════════════════════
   8. APP — роутер, обработчики действий, запуск
   ════════════════════════════════════════════════════════════════ */
const Router = {
  go(hash) { if (location.hash === hash) App.render(); else location.hash = hash; },
};
const Views = { home: HomeView, customer: CustomerView, courier: CourierView, admin: AdminView };

const App = {
  view: null,
  state: { category: 'all', query: '', adminSection: 'overview', adminTicketId: null, adminTicketFilter: 'all', adminOrderFilter: 'all', adminUserFilter: 'all' },

  /* хэш-роутер с проверкой ролей:  #/ · #/menu · #/orders[/ID] · #/courier[/history|chat] · #/admin[/раздел] */
  render() {
    const me = Sel.me();
    const seg = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
    let view = 'home';
    if (!me) {
      if (seg.length) { location.replace('#/'); return; }
    } else {
      const ok = me.role === 'admin' ? seg[0] === 'admin' : me.role === 'courier' ? seg[0] === 'courier' : ['menu', 'orders', 'favorites', 'bonuses'].includes(seg[0]);
      if (!ok) { location.replace('#/' + (me.role === 'admin' ? 'admin' : me.role === 'courier' ? 'courier' : 'menu')); return; }
      view = me.role;
    }
    const changed = this.view !== view;
    this.view = view;
    if (changed) { Modal.closeAll(); window.scrollTo(0, 0); }
    Views[view].render(seg);
    document.title = { home: 'Moggs Delivery — доставка еды', customer: 'Меню · Moggs Delivery', courier: 'Курьер · Moggs Delivery', admin: 'Админ-панель · Moggs Delivery' }[view];
  },
};

/* ── подписки на данные ── */
Bus.on('db', () => { Notifier.run(); const v = Views[App.view]; if (v && v.refresh) v.refresh(); Live.run(); });
Bus.on('cart', () => { if (App.view === 'customer') CustomerView.onCart(); });
Bus.on('support-badge', () => { if (App.view === 'home') HomeView.refresh(); else if (App.view === 'customer') CustomerView.paintBadges(); });

/* ── действия (data-action="…") ── */
const me_ = () => Sel.me();

const Actions = {
  /* главная / авторизация */
  howItWorks: () => openHowItWorks(),
  authCustomer: () => { Modal.close('how', true); AuthUI.open('customer'); },
  authCourier: () => { Modal.close('how', true); AuthUI.open('courier'); },
  authAdmin: () => AuthUI.open('admin'),
  authTab: t => { AuthUI.tab = t.dataset.tab; AuthUI.paint(); },
  smsBack: () => { AuthUI.stopTimer(); Modal.setTitle('auth', AuthUI.role === 'customer' ? 'Заказчик' : 'Курьер'); AuthUI.paint(); },
  resendSms: () => { Api.auth.resendSms(); AuthUI.startTimer(); },
  openSupport: () => SupportUI.open(),
  closeModals: () => Modal.closeAll(),
  logout: () => { Modal.closeAll(); Api.auth.logout(); Router.go('#/'); },
  copyTag: t => { const tag = t.dataset.tag; try { navigator.clipboard.writeText(tag); } catch (e) { /* ignore */ } Toast.show(`${tag} скопирован`, { icon: '📋' }); },

  /* заказчик */
  setCategory: t => {
    App.state.category = t.dataset.cat; App.state.query = '';
    const i = $('#search'); if (i) i.value = ''; const c = $('.search-clear'); if (c) c.hidden = true;
    CustomerView.paintGrid(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  clearSearch: () => {
    App.state.query = ''; const i = $('#search'); if (i) { i.value = ''; i.focus(); } const c = $('.search-clear'); if (c) c.hidden = true;
    if (CustomerView.route.name !== 'menu') Router.go('#/menu'); else CustomerView.paintGrid();
  },
  addToCart: t => Cart.add(t.dataset.id),
  incCart: t => Cart.add(t.dataset.id),
  decCart: t => Cart.dec(t.dataset.id),
  removeFromCart: t => Cart.remove(t.dataset.id),
  clearCart: () => Cart.clear(),
  openCart: () => CartUI.open(),
  closeCartToMenu: () => Modal.close('cart'),
  checkout: () => { if (!Cart.count()) return; Modal.close('cart', true); CheckoutUI.open(); },
  editAddr: t => {
    const form = t.closest('form'), editing = form.classList.toggle('editing');
    $$('.addr-grid input', form).forEach(i => { i.readOnly = !editing; });
    t.textContent = editing ? 'Готово' : 'Изменить';
    if (editing) $('.addr-grid input[name="street"]', form).focus();
  },
  openProfile: () => openProfile(),
  /* repeatOrder, избранное, промокоды, отзывы — см. ExtrasActions (05b_extras_ui.js) */

  /* курьер */
  toggleOnline: async t => {
    const me = me_();
    if (!t.checked && Sel.courierCurrent(me.id)) { t.checked = true; Toast.show('Сначала завершите текущий заказ', { icon: '⚠️', type: 'error' }); return; }
    await Api.courier.setOnline(me.id, t.checked);
    Toast.show(t.checked ? 'Вы на линии — заказы будут появляться здесь' : 'Вы не в сети', { icon: t.checked ? '🟢' : '⚪' });
  },
  goOnline: async () => { await Api.courier.setOnline(me_().id, true); Toast.show('Вы на линии', { icon: '🟢' }); },
  acceptOrder: async t => { await Api.orders.accept(t.dataset.id, me_().id); Toast.ok(`Заказ #${t.dataset.id} принят. Заберите его в ресторане.`, 'Заказ ваш!'); },
  courierStep: async t => {
    const o = await Api.orders.courierStep(t.dataset.id, me_().id);
    if (o.status === 5) Toast.show(`Вы заработали ${money(CONFIG.courierFee)}`, { icon: '🎉', title: `Заказ #${o.id} доставлен` });
    else Toast.show('Забираем заказ — клиент уже видит статус', { icon: '🛍️' });
  },
  callCustomer: () => Toast.show('Звонок клиенту пойдёт через маскированный номер — скоро будет доступен', { icon: '📞', title: 'Звонок клиенту' }),

  /* админ */
  openOrder: t => AdminUI.openOrder(t.dataset.id),
  orderFilter: t => { App.state.adminOrderFilter = t.dataset.f; AdminView.paint(); },
  userFilter: t => { App.state.adminUserFilter = t.dataset.f; AdminView.paint(); },
  ticketFilter: t => { App.state.adminTicketFilter = t.dataset.f; AdminView.paintTicketList(); },
  openTicket: t => { App.state.adminTicketId = t.dataset.id; AdminView.paintTicketList(); AdminView.paintThread(); },
  closeThread: () => { App.state.adminTicketId = null; AdminView.paintTicketList(); AdminView.paintThread(); },
  adminReply: t => AdminView.openTicketFromAnywhere(t.dataset.id),
  adminCloseTicket: async t => { await Api.support.close(t.dataset.id); Toast.ok(`Обращение #${t.dataset.id} закрыто`, 'Готово'); },
  adminReopen: async t => { await Api.support.reopen(t.dataset.id); },
  contactCourier: t => AdminUI.contactCourier(t.dataset.id),
  assignCourier: async t => { if (!t.value) return; await Api.orders.assign(t.dataset.id, t.value); Toast.ok('Курьер назначен', `Заказ #${t.dataset.id}`); },
  adminNext: t => Api.orders.advance(t.dataset.id),
};

Object.assign(Actions, ExtrasActions);

/* делегирование событий */
const fail = err => { console.error(err); Toast.error(err && err.message ? err.message : 'Что-то пошло не так'); };
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  const fn = Actions[t.dataset.action]; if (!fn) return;
  if (t.tagName !== 'A') e.preventDefault();
  try { const r = fn(t, e); if (r && r.catch) r.catch(fail); } catch (err) { fail(err); }
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-change]'); if (!t) return;
  const fn = Actions[t.dataset.change]; if (!fn) return;
  try { const r = fn(t, e); if (r && r.catch) r.catch(fail); } catch (err) { fail(err); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const fn = Forms[f.dataset.form]; if (!fn) return;
  try { const r = fn(f); if (r && r.catch) r.catch(fail); } catch (err) { fail(err); }
});
/* снимаем подсветку ошибки, как только пользователь правит поле */
const clearErr = e => {
  const f = e.target.closest && e.target.closest('.field.error');
  if (f) { f.classList.remove('error'); const b = $('.field-error', f); if (b) b.textContent = ''; }
  const g = e.target.closest && e.target.closest('.group'); if (g) { const ge = $('.group-error', g); if (ge) ge.hidden = true; }
};
document.addEventListener('input', clearErr); document.addEventListener('change', clearErr);

/* ── запуск ── */
(function boot() {
  Db.load(); Notifier.snap(); Sim.start();
  window.addEventListener('hashchange', () => App.render());
  App.render();
  window.Moggs = { Db, Api, Sel, Cart, Extras };   // для отладки в консоли
})();
</script>
<script>

/* ════════════════════════════════════════════════════════════════
   9. FX — мягкие анимации интерфейса и еды (логику не трогают)
   Принципы: только transform/opacity, выход быстрее входа, анимации
   не блокируют ввод, prefers-reduced-motion отключает всё лишнее.
   ════════════════════════════════════════════════════════════════ */
(function fx() {
  const reduce = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = window.matchMedia && matchMedia('(pointer:fine)').matches;
  const root = document.getElementById('app');
  if (!root) return;
  const EASE = 'cubic-bezier(.22,.8,.24,1)';

  /* ── 1. Появление блоков при скролле ──
        «Вооружаемся» только при смене экрана / клике, чтобы живые обновления
        (новые заказы, чат) не мигали. */
  const SEL = '.dish:not(.skel),.rec-card,.promo-tile,.bonus-hero,.bn-card,.order-card,.card,.a-card,.kpi,.cour-card,.deliv,.k-order,.hist-row,.sec-head,.co-card,.new-ticket,.page-head,.greet,.track-head,.how-card';
  let armedUntil = Date.now() + 1500;
  const arm = (ms = 700) => { armedUntil = Date.now() + ms; };
  document.addEventListener('click', () => arm(700), true);

  const io = ('IntersectionObserver' in window)
    ? new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          const el = e.target; io.unobserve(el);
          requestAnimationFrame(() => {
            el.classList.add('in');
            const d = parseInt(el.style.getPropertyValue('--d')) || 0;
            setTimeout(() => { el.classList.remove('rv', 'in'); el.style.removeProperty('--d'); }, 900 + d);
          });
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 })
    : null;

  function scan() {
    if (!io || reduce() || Date.now() > armedUntil) return;
    const fresh = [...root.querySelectorAll(SEL)].filter(el => !el.dataset.fx && !el.closest('.modal'));
    let i = 0;
    fresh.forEach(el => {
      el.dataset.fx = '1';
      el.classList.add('rv');
      el.style.setProperty('--d', Math.min(i++ % 9, 8) * 45 + 'ms');   // stagger 30–50 мс
      io.observe(el);
    });
  }

  /* ── 2. Декор, который нужно добавить после отрисовки экрана ── */
  const FOODS = [
    ['🍕', '5%', '58%', '46px', '15s', '-2s', '1px', ''], ['🍔', '13%', '20%', '34px', '17s', '-6s', '0px', 'hide-s'],
    ['🥗', '88%', '52%', '48px', '16s', '-4s', '1px', ''], ['🍰', '92%', '18%', '36px', '13s', '-9s', '0px', 'hide-s'],
    ['☕', '20%', '78%', '38px', '18s', '-1s', '2px', ''], ['🍣', '78%', '74%', '40px', '14s', '-7s', '2px', 'hide-s'],
    ['🍓', '3%', '34%', '28px', '12s', '-3s', '3px', 'hide-s'], ['🥐', '95%', '38%', '30px', '19s', '-11s', '3px', 'hide-s'],
  ];
  function decorate() {
    const home = root.querySelector('.home');
    if (home && !home.querySelector('.food-float') && !reduce()) {
      const box = document.createElement('div'); box.className = 'food-float'; box.setAttribute('aria-hidden', 'true');
      box.innerHTML = FOODS.map(f => `<span class="ff ${f[7]}" style="--x:${f[1]};--y:${f[2]};--s:${f[3]};--t:${f[4]};--dl:${f[5]};--b:${f[6]}">${f[0]}</span>`).join('');
      home.insertBefore(box, home.querySelector('.rail'));
    }
    // конфетти из еды на экране «Заказ оформлен»
    const ok = document.querySelector('.success .order-id');
    if (ok && !ok.dataset.burst) { ok.dataset.burst = '1'; burst(ok); }
  }
  let queued = false;
  new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; scan(); decorate(); }); } })
    .observe(document.body, { childList: true, subtree: true });
  scan(); decorate();

  /* ── 3. Переходы между экранами (View Transitions API) ── */
  if (typeof App !== 'undefined' && App.render) {
    const orig = App.render.bind(App);
    let lastHash = location.hash, lastView = App.view;
    App.render = function () {
      const hash = location.hash, willChange = hash !== lastHash;
      lastHash = hash;
      if (!willChange || reduce()) { orig(); return; }
      arm(1500);
      if (document.startViewTransition) {
        try {
          const vt = document.startViewTransition(() => { orig(); scan(); decorate(); });
          vt.finished && vt.finished.catch(() => {});
          return;
        } catch (e) { /* ниже — обычный путь */ }
      }
      orig(); scan(); decorate();
      root.classList.remove('pt'); void root.offsetWidth; root.classList.add('pt');
      setTimeout(() => root.classList.remove('pt'), 520);
    };
  }

  /* ── 4. Ripple на кнопках ── */
  document.addEventListener('pointerdown', e => {
    if (reduce()) return;
    const t = e.target.closest && e.target.closest('.btn,.role-btn,.cat');
    if (!t || t.disabled) return;
    const r = t.getBoundingClientRect(), s = Math.max(r.width, r.height);
    const w = document.createElement('span');
    w.className = 'ripple';
    w.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
    if (getComputedStyle(t).position === 'static') t.style.position = 'relative';
    t.style.overflow = 'hidden';
    t.appendChild(w);
    setTimeout(() => w.remove(), 700);
  }, { passive: true });

  /* ── 5. Параллакс: фото-ряд на главной и фото внутри карточки блюда ── */
  if (fine) {
    let raf = 0, ev = null;
    document.addEventListener('pointermove', e => {
      ev = e; if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0; if (reduce() || !ev) return;
        const rail = document.querySelector('.rail');
        if (rail) {
          rail.style.setProperty('--mx', ((ev.clientX / innerWidth) - .5).toFixed(3));
          rail.style.setProperty('--my', ((ev.clientY / innerHeight) - .5).toFixed(3));
        }
        const ph = ev.target.closest && ev.target.closest('.dish-photo');
        if (ph) {
          const r = ph.getBoundingClientRect();
          ph.style.setProperty('--px', (((ev.clientX - r.left) / r.width) - .5).toFixed(3));
          ph.style.setProperty('--py', (((ev.clientY - r.top) / r.height) - .5).toFixed(3));
        }
      });
    }, { passive: true });
    document.addEventListener('pointerout', e => {
      const ph = e.target.closest && e.target.closest('.dish-photo');
      if (ph && !ph.contains(e.relatedTarget)) { ph.style.removeProperty('--px'); ph.style.removeProperty('--py'); }
    }, { passive: true });
  }

  /* ── 6. Блюдо летит в корзину ── */
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-action="addToCart"],[data-action="incCart"]');
    if (!b || reduce() || !b.animate) return;
    const card = b.closest('.dish,.rec-card,.dm'); if (!card) return;
    const photo = card.querySelector('.dish-photo,.rec-ph,.dm-photo'), img = photo && photo.querySelector('img');
    let target = document.querySelector('.cart-btn');
    if (!target || !target.offsetParent) target = document.querySelector('.cart-bar');
    if (!photo || !target) return;
    const pr = photo.getBoundingClientRect(), tr = target.getBoundingClientRect();
    const S = 68, sx = pr.left + pr.width / 2 - S / 2, sy = pr.top + pr.height / 2 - S / 2;
    const dx = tr.left + tr.width / 2 - S / 2 - sx, dy = tr.top + tr.height / 2 - S / 2 - sy;
    const el = document.createElement('div'); el.className = 'fly-food'; el.setAttribute('aria-hidden', 'true');
    if (img && img.currentSrc) el.style.backgroundImage = `url("${img.currentSrc}")`; else el.textContent = (card.querySelector('.plate') || {}).textContent || '🍽️';
    document.body.appendChild(el);
    const lift = -Math.min(160, Math.abs(dy) * .35 + 60);       // дуга: сначала вверх, потом к корзине
    const a = el.animate([
      { transform: `translate(${sx}px,${sy}px) scale(.6)`, opacity: 0 },
      { transform: `translate(${sx + dx * .18}px,${sy + dy * .18 + lift}px) scale(1.08)`, opacity: 1, offset: .22 },
      { transform: `translate(${sx + dx * .62}px,${sy + dy * .62 + lift * .55}px) scale(.8)`, opacity: 1, offset: .62 },
      { transform: `translate(${sx + dx}px,${sy + dy}px) scale(.22) rotate(200deg)`, opacity: .25 },
    ], { duration: 780, easing: EASE });
    a.onfinish = () => { el.remove(); target.classList.remove('landed'); void target.offsetWidth; target.classList.add('landed'); setTimeout(() => target.classList.remove('landed'), 600); };
    a.oncancel = () => el.remove();
  }, true);

  /* ── 7. Конфетти из еды ── */
  function burst(anchor) {
    if (reduce() || !anchor.animate) return;
    const r = anchor.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const set = ['🍕', '🍔', '🍰', '🍓', '🥐', '🍣', '🥗', '🍩', '🍋', '🌮', '🍪', '☕'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span'); s.className = 'food-burst'; s.textContent = set[i % set.length]; s.setAttribute('aria-hidden', 'true');
      s.style.left = cx + 'px'; s.style.top = cy + 'px'; s.style.fontSize = (20 + Math.random() * 16) + 'px';
      document.body.appendChild(s);
      const ang = (-Math.PI / 2) + (Math.random() - .5) * Math.PI * 1.25, v = 120 + Math.random() * 190;
      const dx = Math.cos(ang) * v, dy = Math.sin(ang) * v, fall = 140 + Math.random() * 120, rot = (Math.random() - .5) * 540;
      const a = s.animate([
        { transform: 'translate(-50%,-50%) scale(.2) rotate(0deg)', opacity: 0 },
        { transform: `translate(calc(-50% + ${dx * .7}px),calc(-50% + ${dy}px)) scale(1) rotate(${rot * .5}deg)`, opacity: 1, offset: .35 },
        { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy + fall}px)) scale(.9) rotate(${rot}deg)`, opacity: 0 },
      ], { duration: 1500 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.3,1)', delay: Math.random() * 160 });
      a.onfinish = () => s.remove(); a.oncancel = () => s.remove();
    }
  }
})();
</script>
